<title>MAIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: demokader met tabbladen; vormtaal gelijk aan XENA, MIRA, TINA en ELSA. */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --green:#1b6f3f; --green-soft:#def2e5; --blue:#2c5c9c; --blue-soft:#e1eaf7;
  --app:#0f6cbd; --shadow:0 10px 30px rgba(10,40,46,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1360px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-size:17px;font-weight:600}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;white-space:nowrap}
.ttl .sub{color:var(--muted);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);font-weight:500;background:var(--surface);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sel)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.regie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;font-size:12.5px;color:var(--muted)}
.regie b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.regie .seg button{padding:3px 10px;font-size:12.5px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.page{padding:20px 22px 26px;display:grid;gap:16px}
.page h2{font-size:19px;font-weight:600;text-wrap:balance}
.lead{max-width:72ch;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.n-amber{background:var(--amber-soft);color:var(--amber)} .n-violet{background:var(--violet-soft);color:var(--violet)} .n-green{background:var(--green-soft);color:var(--green)} .n-grey{background:var(--surface2);color:var(--fg)} .n-red{background:var(--red-soft);color:var(--red)}
.note span{color:var(--fg)} .note svg{margin-top:2px}

/* mailprogramma */
.mc-top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--app);color:#fff;font-size:12.5px;flex-wrap:wrap}
.mc-top b{font-weight:600}.mc-top .acc{margin-left:auto;opacity:.92}
.mc-bar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.mc-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.tb{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;font-size:12.5px;color:var(--fg)}
.tb:hover:not(:disabled){background:var(--sel)} .tb:disabled{opacity:.45;cursor:default} .tb svg{color:var(--app)}
.mc-bar select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.mc-bar input[type=search]{flex:1 1 200px;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.mc{display:grid;grid-template-columns:190px 290px minmax(0,1fr) 340px;min-height:580px}.mc.nopane{grid-template-columns:190px 300px minmax(0,1fr)}
.tag{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-violet{color:var(--violet)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ap{display:flex;border-left:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 30%,var(--surface));min-width:0;max-height:640px}
.ap.off{display:block;background:var(--surface2);overflow:auto}
.apm{flex:1;min-width:0;overflow:auto}
.aph{position:sticky;top:0;display:flex;gap:9px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);border-left:3px solid var(--accent);z-index:1}
.aph h3{font-size:13.5px}.aph p{font-size:11.5px;color:var(--muted)}.aph svg{color:var(--accent)}
.apb{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:13px}.apb>*{min-width:0}.apb h3{font-size:14px}.apb h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px}.apb h4 b{color:var(--fg)}
.apl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.apl li{min-width:0}.apl button{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}.apl button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apl button:hover{border-color:var(--accent)}
.apl .gn{display:grid;gap:1px;text-align:left}.apl .gn small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apl .gs{color:var(--amber);flex:none}
.gchips{display:flex;flex-wrap:wrap;gap:4px}.gchips button{padding:2px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px}.gchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.gme{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gme svg{color:var(--accent);flex:none}.gme div{flex:1;min-width:0;display:grid}.gme span{font-size:12px;color:var(--muted)}.gme .btn{padding:4px 10px;font-size:12.5px}
.gback{justify-self:start;color:var(--accent);font-size:12.5px;padding:2px 0}.gback:hover{text-decoration:underline}
.gcard{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gav{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.gcard h3{font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.gcard p{font-size:12.5px;color:var(--muted)}
.gdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px}.gdl dt{color:var(--muted)}.gdl dd{margin:0;overflow-wrap:anywhere}
.gact{display:flex;flex-wrap:wrap;gap:6px}.gact .btn{padding:5px 10px;font-size:12.5px}.gact [aria-pressed="true"] path{fill:currentColor}.gact [aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
.gsh{display:grid;gap:6px}.gsh label{display:flex;gap:8px;align-items:center;font-size:13px}.gsh input{accent-color:var(--accent)}
.apr{width:44px;flex:none;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:2px;padding:6px 0}
.apr button{position:relative;height:38px;display:grid;place-items:center;color:var(--accent)}.apr button:hover{background:var(--surface)}
.apr button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
.apr i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9.5px;font-weight:600;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 4px}
.ap .el{border:0;background:none;padding:12px 14px}.ap .meta{grid-template-columns:minmax(0,1fr)}.ap .el .q{flex-direction:column;align-items:stretch}.ap .el .q .btn{justify-content:center}
.fold{border-right:1px solid var(--line);padding:8px 0;background:var(--surface2);font-size:13px}
.fold h4{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 14px 4px;font-weight:600}
.fold button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 14px}
.fold button:hover{background:var(--sel)} .fold button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fold button span{flex:1;min-width:0} .fold button b{font-size:11.5px;font-weight:600;color:var(--app)}
.fold .gr{padding:10px 14px 0;font-size:11.5px;color:var(--muted)}
.list{border-right:1px solid var(--line);overflow:auto;max-height:640px}
.mi{display:grid;gap:2px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left}
.mi:hover{background:var(--surface2)} .mi[aria-current="true"]{background:var(--sel);border-left-color:var(--app)}
.mi .r1{display:flex;gap:6px;align-items:baseline}.mi .r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mi.read .r1 b{font-weight:500}
.mi .r1 time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mi .sj{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .pv{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.empty{padding:30px 16px;color:var(--muted);text-align:center;font-size:13px}
.read-p{overflow:auto;max-height:640px;display:flex;flex-direction:column}
.el{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));padding:10px 16px;display:grid;gap:8px}
.el .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.el .h b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.el .q{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.el .q strong{font-weight:600}
.el .sug{font-size:12.5px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fld{display:grid;gap:3px;font-size:12.5px}
.fld label{font-weight:500}
.fld select,.fld input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.fld .ro{padding:5px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.msg{padding:16px 18px 22px;display:grid;gap:10px}
.msg h2{font-size:18px;font-weight:600;text-wrap:balance}
.mh{display:grid;grid-template-columns:70px minmax(0,1fr);gap:3px 10px;font-size:13px}
.mh dt{color:var(--muted)} .mh dd{overflow-wrap:anywhere}
.body{font-family:var(--serif);font-size:14.5px;line-height:1.6;max-width:66ch;display:grid;gap:8px}
.enc{border:1px dashed var(--violet);border-radius:8px;padding:16px;color:var(--violet);display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--violet-soft)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:100%}
.att small{display:block;color:var(--muted);font-size:11px}
.ref{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}

/* doorstroom */
.steps{display:grid;gap:0}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.stp .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600;background:var(--surface)}
.stp.done .dot{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.stp.now .dot{border-color:var(--accent);color:var(--accent)}
.stp b{font-size:14px}.stp p{font-size:12.5px;color:var(--muted)}
.stp time{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.stp code{display:block;margin-top:4px;font-family:var(--mono);font-size:11.5px;background:var(--surface2);border-radius:6px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}

/* filters */
.rule{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.rule .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rule .r1 b{flex:1;min-width:0}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
pre.sv{margin:0;font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.rules{display:grid;gap:8px}
.lim{display:grid;gap:6px;font-size:13px}.lim li{display:flex;gap:8px;align-items:flex-start}

/* adresboek */
.ab{width:100%;border-collapse:collapse;font-size:13px}
.ab th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 10px;background:var(--surface2);white-space:nowrap}
.ab td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.ab td small{display:block;color:var(--muted);font-size:11.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.share{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.share label{display:flex;gap:8px;align-items:center;font-size:13px}
.share input{accent-color:var(--accent)}
.srch{display:flex;gap:8px;flex-wrap:wrap}.srch input{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* sleutels */
.req{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;justify-items:start}.req dl{justify-self:stretch}
.req dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:3px 10px;font-size:13px}.req dt{color:var(--muted)}
.log{display:grid;gap:4px;font-size:12.5px}.log li{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px}.log time{color:var(--muted);font-family:var(--mono);font-size:11.5px}

/* architectuur */
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.zone{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.zone>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.bx{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--blue-soft);display:grid;gap:2px}
.bx b{font-size:13.5px}.bx small{font-size:12px;color:var(--muted)}
.bx.u{background:var(--surface2)}
.flow{display:grid;gap:6px;font-size:13px}.flow li{display:flex;gap:10px;align-items:baseline}.flow li i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none;width:22px}
.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.open div{border-left:3px solid var(--amber);padding:2px 0 2px 12px;display:grid;gap:3px}.open b{font-size:14px}.open span{font-size:13px;color:var(--muted)}

.hood{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:6px 12px}
.hood b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex:none}
.hood code{flex:1 1 300px;min-width:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:20;max-width:min(400px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}
#layer:empty{display:none}
#layer{position:fixed;inset:0;background:rgba(8,24,28,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:600px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;display:grid;gap:12px}
.dlg h2{font-size:16px}
/* colofon */
@property --ca{syntax:'<angle>';inherits:false;initial-value:0deg}
.dlg.colo{max-width:640px;padding:0;gap:0;display:flex;flex-direction:column;position:relative;overflow:hidden;isolation:isolate;border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ca,0deg),var(--accent),var(--violet),var(--amber),var(--green),var(--accent)) border-box;animation:clBorder 8s linear infinite}
.colo .cfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1;border-radius:inherit}
.colo .cin{overflow:auto;min-height:0;flex:1}
.colo .aur{position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:.32;filter:blur(40px);background:radial-gradient(closest-side at 30% 30%,var(--accent),transparent 70%),radial-gradient(closest-side at 70% 40%,var(--violet),transparent 70%),radial-gradient(closest-side at 50% 75%,var(--amber),transparent 70%);animation:clAur 18s ease-in-out infinite alternate}
.colo .sp{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none;z-index:0;animation:clSp 6s ease-in-out infinite}
.colo .chead{display:flex;gap:16px;align-items:center;padding:18px 18px 4px}
.colo .seal{flex:none;width:96px;height:96px;position:relative}
.colo .seal svg.ring{position:absolute;inset:0;animation:clSpin 28s linear infinite}
.colo .seal text{font:600 8.4px var(--mono,monospace);letter-spacing:.18em;fill:var(--accent)}
.colo .seal svg.core{position:absolute;inset:22px;width:52px;height:52px}
.colo .seal .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:clDraw 1.6s .3s ease-out forwards}
.colo h2.ct{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;background:linear-gradient(100deg,var(--fg) 20%,var(--accent) 40%,var(--violet) 50%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:clShine 6s ease-in-out infinite}
.colo .csub{color:var(--muted);font-size:12.5px;margin-top:2px}
.colo .mb{padding:10px 18px 4px}
.colo dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13px}
.colo dt{color:var(--muted)}
.colo dd{margin:0;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}
.colo dd small{color:var(--muted);font-size:12px}
.colo dd ul{list-style:disc;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.colo dd li{display:list-item;border:0;padding:0}
.colo dd a{color:var(--accent)}
.colo .sel{user-select:all;font-family:var(--mono);font-size:12px}
.colo .cl{opacity:0;transform:translateY(8px);animation:clIn .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*85ms + 250ms)}
.colo .cnote{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;color:var(--muted);font-size:12px}
.colo .cfoot{display:flex;justify-content:flex-end;padding:10px 18px 16px}
@media (max-width:560px){.colo .chead{flex-direction:column;align-items:flex-start}.colo dl{grid-template-columns:1fr;gap:2px}.colo dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){.dlg.colo,.colo .aur,.colo .sp,.colo .seal svg.ring,.colo h2.ct{animation:none}.colo .cl{animation:none;opacity:1;transform:none}.colo .seal .draw{animation:none;stroke-dashoffset:0}}
@keyframes clBorder{to{--ca:360deg}}
@keyframes clAur{0%{transform:translate(-6%,-4%) rotate(0deg) scale(1)}100%{transform:translate(6%,5%) rotate(25deg) scale(1.12)}}
@keyframes clSp{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
@keyframes clSpin{to{transform:rotate(360deg)}}
@keyframes clDraw{to{stroke-dashoffset:0}}
@keyframes clShine{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes clIn{to{opacity:1;transform:none}}


/* koppelen aan zaak en dossier */
.ch{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px;justify-items:start;background:var(--surface);margin:8px 0 4px}.chh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.chd{display:flex;gap:6px;align-items:flex-start;font-size:12.5px}.chd svg{flex:none;margin-top:2px;color:var(--accent)}
.rv{display:grid;gap:6px;justify-items:start;width:100%}.rv h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.rv .fld,.rv textarea{width:100%}.rv textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit}
.lkw{position:relative}
.lki{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.lkl{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:grid;gap:2px;max-height:280px;overflow:auto}
.lkl li[role="option"]{display:grid;gap:1px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px}
.lkl li b{font-weight:500;min-width:0}.lkl li small{color:var(--muted);font-size:11.5px}.lkl li .mono{font-size:11px}
.lkl li[aria-selected="true"],.lkl li[role="option"]:hover{background:var(--accent-soft)}
.lkl mark{background:var(--amber-soft);color:inherit;font-weight:600;border-radius:2px}
.lkm{padding:6px 8px;color:var(--muted);font-size:12.5px}
.lkm.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:7px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:lkSpin .7s linear infinite;vertical-align:-1px}
@keyframes lkSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lkm.busy::before{animation:none}}
.lkd{display:grid;gap:5px}
.lkc{display:flex;align-items:center;gap:7px;padding:3px 3px 3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}.lkc>span{flex:1;min-width:0;display:grid}.lkc small{color:var(--muted);font-size:11.5px}.lkc svg{color:var(--accent);flex:none}
.lkc button{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:5px;color:var(--muted);font-size:16px;line-height:1}.lkc button:hover{background:var(--red-soft);color:var(--red)}
.lks{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted)}
.lks button{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border:1px dashed var(--accent);border-radius:99px;color:var(--accent);font-size:12px}.lks button:hover{background:var(--accent-soft)}
.dlg .rowb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg textarea{width:100%;min-height:110px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--serif)}
.to-list{display:grid;gap:2px;border:1px solid var(--line);border-radius:6px;max-height:150px;overflow:auto}
.to-list button{padding:5px 9px;text-align:left;font-size:13px}.to-list button:hover{background:var(--sel)}.to-list small{color:var(--muted)}

.xarch{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.xarch>div{display:grid;gap:0;align-content:start}.xarch h2{font-size:17px}.xarch .lead{margin:4px 0 12px}.xarch .gchips{margin-bottom:4px}
.xtop{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch}.xcol{display:flex;flex-direction:column}.xtop>.xcol>.layer:last-child{flex:1}.conn.lab span{position:relative;background:var(--surface);border:1px dashed var(--line);color:var(--muted);border-radius:99px;padding:2px 10px;font-size:12px}
.xtop .boxes{grid-template-columns:minmax(0,1fr)}.xcol{min-width:0}
.harrow{align-self:center;display:grid;justify-items:center;gap:2px;padding:0 8px;max-width:84px;text-align:center;font-size:11px;color:var(--muted)}.harrow b{font-size:20px;color:var(--accent);line-height:1}
.xconn{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.xconn>div:nth-child(2){width:100px}
@media (max-width:640px){.xtop,.xconn{grid-template-columns:minmax(0,1fr)}.harrow{max-width:none;padding:6px 0}.harrow b{transform:rotate(90deg)}.xconn>div:nth-child(2){display:none}}
.layer{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;background:var(--surface2)}
.layer.key{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.layer h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px}
.layer .hint{margin-top:8px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.layer.key .bx{background:var(--surface)}
.conn{display:flex;justify-content:center;padding:6px 0;position:relative}
.conn::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line)}
.conn button{position:relative;background:var(--surface);border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:500}
.conn button:hover{background:var(--accent-soft)}
.sq{display:grid;gap:8px;margin:12px 0 4px;counter-reset:none}
.sq li{display:flex;gap:10px;align-items:flex-start}
.sq .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.sq li>div{display:grid;gap:3px;justify-items:start}.sq p{font-size:13px}
.tgrp{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-top:12px}
.tgrp>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.tgrp>header b{font-weight:600}
.tgrp>header>span:not(.pill){font-size:12px;color:var(--muted);flex:1 1 260px}
.tgrp>div:not(.trow):not(.tw0){padding:10px 12px}
.tgrp ul{padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;list-style:disc}
.tw0{overflow-x:auto}
.tt{border-collapse:collapse;font-size:13px;width:100%;min-width:560px}
.tt th,.tt td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tt tr.hl td{background:var(--accent-soft)}.tt tr.dim td{color:var(--muted)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:4px 14px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px}
.trow:last-child{border-bottom:0}
.trow.hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.trow .fn{font-weight:500}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;background:var(--surface);font-size:13px}
.opt.pick{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.opt header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.opt h3{font-size:14px;flex:1;min-width:0}
.opt .ok{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.pm{display:grid;gap:4px}.pm li{display:flex;gap:7px;align-items:baseline}.pm li::before{flex:none;font-weight:700;width:12px}
.pm.plus li::before{content:"+";color:var(--green)}.pm.min li::before{content:"−";color:var(--red)}
.gsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.gstep{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.gstep.out{border-style:dashed}
.gstep .gnum{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gstep .gnum .pill{text-transform:none;letter-spacing:0;font-size:11px}
.gstep h3{font-size:14px;font-weight:600;margin:4px 0 0}
.gstep .when{font-size:11.5px;color:var(--muted)}
.gstep dl{display:flex;flex-direction:column;gap:6px}.gstep dt{font-size:11px;color:var(--muted);font-weight:600}.gstep dd{margin:0}
.gms{margin-top:auto;display:flex;gap:8px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:8px;font-weight:500}
.gms .dia{flex:none;width:9px;height:9px;background:var(--accent);transform:rotate(45deg);margin-top:4px}
.gtwo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.gtwo p{font-size:13px}.tgrp .gtwo{padding:10px 12px}
@media (max-width:1200px){.mc,.mc.nopane{grid-template-columns:170px 260px minmax(0,1fr)}.mc .ap{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}}
@media (max-width:1000px){
  .mc,.mc.nopane{grid-template-columns:minmax(0,1fr)}
  .fold{display:flex;flex-wrap:wrap;gap:2px;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .fold h4,.fold .gr{display:none}.fold button{width:auto;padding:5px 10px;border-radius:6px}
  .list{border-right:0;border-bottom:1px solid var(--line);max-height:300px}.read-p{max-height:none}
  .cols,.arch,.xarch,.opts,.gtwo{grid-template-columns:minmax(0,1fr)}
  .page{padding:16px}
}

/* MAIA: chatomgeving in vier kolommen: kanalen, gesprekken, het gesprek en het paneel van de Office Assistent */
.cc{display:grid;grid-template-columns:210px 270px minmax(0,1fr) 350px;min-height:600px}.cc.nopane{grid-template-columns:210px 280px minmax(0,1fr)}
.crail{border-right:1px solid var(--line);padding:8px 0;background:var(--surface2);font-size:13px;overflow:auto;max-height:680px}
.crail h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 14px 4px;font-weight:600}
.crail button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 14px}
.crail button:hover{background:var(--sel)}.crail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.crail .cd{width:10px;height:10px;border-radius:3px}.crail small{font-size:11px;font-weight:600;color:var(--muted)}
.crail .gr{padding:10px 14px 0;font-size:11.5px;color:var(--muted)}
.clist{border-right:1px solid var(--line);overflow:auto;max-height:680px}
.ci{display:grid;gap:2px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left}
.ci>*{min-width:0}
.ci:hover{background:var(--surface2)}.ci[aria-current="true"]{background:var(--sel);border-left-color:var(--chc,var(--accent))}
.ci .r1{display:flex;gap:6px;align-items:baseline}.ci .r1 b{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ci .r1 time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ci .pv{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.conv{display:flex;flex-direction:column;min-width:0;max-height:680px}
.cvh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chc);color:#fff;flex-wrap:wrap}
.cvh b{font-weight:600}.cvh small{opacity:.9;font-size:12px}.cvh .pn{margin-left:auto;display:flex;gap:6px;align-items:center}
.cvh .tb{color:#fff;border:1px solid rgba(255,255,255,.5)}.cvh .tb:hover{background:rgba(255,255,255,.15)}.cvh .tb svg{color:#fff}
.cvh .tb[aria-pressed="true"]{background:rgba(255,255,255,.25);color:#fff}
.cvb{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:12.5px;flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:10px 12px;display:grid;gap:2px;align-content:start}
.dsep{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0;display:flex;gap:10px;align-items:center}.dsep::before,.dsep::after{content:"";flex:1;height:1px;background:var(--line)}
.mr{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:4px 6px;border-radius:8px;align-items:start}
.mr.pk{background:var(--accent-soft)}
.mr input{margin-top:10px;accent-color:var(--accent);width:16px;height:16px}
.mw{display:flex;gap:8px;align-items:flex-start;min-width:0}.mr.me .mw{flex-direction:row-reverse}
.bub{max-width:min(80%,560px);min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:6px 10px 7px}
.mr.me .bub{background:color-mix(in srgb,var(--chc) 13%,var(--surface));border-color:color-mix(in srgb,var(--chc) 32%,var(--line));border-radius:12px 12px 4px 12px}
.mr.pk .bub{box-shadow:0 0 0 2px var(--accent)}
.mr.me .mb1,.mr.me .mst{justify-content:flex-end}.mr.me .mtx{text-align:left}
.cvb label{display:inline-flex;gap:6px;align-items:center;font-weight:500}.cvb label input{accent-color:var(--accent);width:16px;height:16px}
.cvb .sp{flex:1}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface);gap:2px}
.sw button{padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.sw button[aria-pressed="true"]{background:var(--green);color:#fff}.sw button[aria-pressed="true"][data-v="persoonlijk"]{background:var(--violet)}
.sw button:disabled{cursor:default}.sw.ro{opacity:.75}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sw button[aria-pressed="true"]{color:#06272c}}:root[data-theme="dark"] .sw button[aria-pressed="true"]{color:#06272c}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.mr.me .av{background:var(--chc);color:#fff;border-color:transparent}
.mr.bot .av{background:var(--violet-soft);color:var(--violet)}
.mb1{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}.mb1 b{font-weight:600}.mb1 time{color:var(--muted);font-size:11.5px}.mb1 .org{color:var(--muted);font-size:11.5px}
.mtx{font-size:14px;overflow-wrap:anywhere;margin-top:1px}
.mtx.del{color:var(--muted);font-style:italic}
.mtx mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 3px;font-weight:600}
.mat{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;margin-top:5px;background:var(--surface)}
.mat small{display:block;color:var(--muted);font-size:11px}
.mst{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sysm{text-align:center;font-size:12px;color:var(--violet);padding:6px 10px;margin:4px auto;background:var(--violet-soft);border-radius:99px;display:flex;gap:6px;align-items:center;justify-content:center;max-width:100%}
.cmp{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
.cmp input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.cmp .hint{flex-basis:100%}
.cmpw{border-top:1px solid var(--line)}.cmpw .cmp{border-top:0}.cmpw>p{padding:0 12px 8px}
.conn.multi{gap:6px;flex-wrap:wrap}
.kdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px}.kdl dt{color:var(--muted)}.kdl dd{margin:0}
.box{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:7px;background:var(--surface);justify-items:start}.box>*{max-width:100%}
.box .fld{width:100%}
.bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}.bh b{flex:1;min-width:0}
.rowb2{display:flex;flex-wrap:wrap;gap:6px}
.lnk{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 3px 3px 8px;border:1px solid var(--line);border-radius:6px;width:100%}.lnk span{flex:1;min-width:0;display:grid}.lnk small{color:var(--muted);font-size:11.5px}
.lnk button{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:5px;color:var(--muted);font-size:16px;line-height:1}.lnk button:hover{background:var(--red-soft);color:var(--red)}

function mstate(c,m){if(m.sys)return 'sys';var k=CHB[c.ch].k;
  if(k==='C')return m.cap?'arch':(c.aard==='persoonlijk'?'pers':'none');
  if(aardOf(c)==='persoonlijk')return 'pers';
  if(k==='A2')return (m.cap||(c.arch&&m.n>=c.archFrom))?'arch':'none';

var STL={arch:['In het archief','p-green'],pers:['Persoonlijk, versleuteld','p-violet'],none:['Niet in het archief','p-amber'],open:['Nog te scheiden','p-blue']};

function tx(c,m){var s=(m.lit||c.lit)?m.tx:t(m.tx);return S.anon===c.id||(S.anon==='ok:'+c.id)?anon(s):s}
function anon(s){return s.replace(/(\+31 ?6|06)[ -]?\d[\d ]{6,11}\d/g,'[[tel]]').replace(/(mevrouw|Mrs\.?|Frau|Madame)? ?(J\. )?[Dd]e Graaf/g,function(x,a){return (a?a+' ':'')+'[[naam]]'}).replace(/Kleverlaan 30/g,'[[adres]]')}
function anonHtml(s){return esc(s).replace(/\[\[(tel|naam|adres)\]\]/g,function(x,k){return '<mark>['+T({tel:'telefoonnummer',naam:'naam',adres:'adres'}[k])+']</mark>'})}
function ini(n){return n.split(/[ ·]+/).filter(function(x){return /^[A-ZÀ-Ý]/.test(x)}).slice(0,2).map(function(x){return x[0]}).join('')||n[0]}
function convs(ch){return CONV.filter(function(c){return c.ch===ch})}
function lastMsg(c){for(var i=c.msgs.length-1;i>=0;i--)if(!c.msgs[i].sys)return c.msgs[i];return c.msgs[0]}
function picked(c){return c.msgs.filter(function(m){return S.pick[m.id]})}
function cnt(){var o={sort:0,arch:0,c:0};CONV.forEach(function(c){if(openC(c))o.sort++;var k=CHB[c.ch].k;

    +['In stap 1 staat het origineel nog bij Microsoft. Dat is een tussenstap om te leren, geen eindbeeld.','Medewerkers kiezen de chat die werkt. Talk en Matrix moeten net zo prettig zijn als Teams, anders gaat het gesprek naar WhatsApp.','Een archiefdeelnemer is zichtbaar. Dat is de bedoeling, maar het vraagt uitleg aan collega’s van andere organisaties.','Vastleggen vanaf de telefoon hangt af van de medewerker. Afspraken en de assistent maken het makkelijk, niet vanzelf.'].map(function(x){return '<li>'+T(x)+'</li>'}).join('')+'</ul></div></section>'
    +'<section class="tgrp"><header><b>'+T('Verhouding tot Common Ground')+'</b></header><div><ul>'
    +['MAIA registreert geen zaken. Het zaaksysteem blijft leidend; MAIA legt de koppeling vast als kenmerk, via de Zaken API.','Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.','Open standaarden aan elke ingang: Matrix, WebDAV, S3. Elke chatomgeving is te vervangen zonder het archief te raken.'].map(function(x){return '<li>'+T(x)+'</li>'}).join('')+'</ul></div></section></div></div></div>'}

function modal(){var L=document.getElementById('layer');if(S.colo){if(!L.querySelector('.colo')){L.innerHTML=colofonHtml();L.querySelector('[data-act="coloX"]').focus()}return}L.innerHTML=''}

/* ---------- weergave ---------- */
var VIEWS=[['chat','Gesprekken'],['kan','Kanalen'],['arch','Architectuur'],['tech','Techniek'],['groei','Groeipad']];
function render(){CONV.forEach(auto);var n=cnt();
  document.getElementById('top').innerHTML='<div class="ttl"><h1>MAIA<small>Messaging Archive &amp; Information Assistant</small></h1><div class="sub">'+T('Chatberichten archiveren in XENA: uit elk kanaal in hetzelfde register, met de assistent naast het gesprek.')+' <span>'+T('Versie {0}',DEMO.v)+'</span> · <span>'+esc(DEMO.d)+'</span> · <button type="button" class="linkbtn" data-act="colofon">'+T('Colofon')+'</button></div></div>'
    +'<div class="seg" role="group" aria-label="'+T('Weergave')+'">'+VIEWS.map(function(v){return '<button type="button" data-act="view" data-v="'+v[0]+'" aria-pressed="'+(S.view===v[0])+'">'+T(v[1])+'</button>'}).join('')+'</div>'
    +'<select class="lang" id="lang" aria-label="Taal / Language">'+Object.keys(LANGS).filter(function(l){return l==='nl'||I18N[l]}).map(function(l){return '<option value="'+l+'"'+(l===LANG?' selected':'')+'>'+LANGS[l]+'</option>'}).join('')+'</select>';
  document.getElementById('regie').innerHTML='<b>'+T('Demo')+'</b><span>'+T('Spring vooruit in de tijd om te zien wat er na tien dagen gebeurt.')+'</span><div class="seg" role="group" aria-label="'+T('Tijd')+'">'+[[0,'Vandaag'],[4,'Over 4 dagen'],[10,'Over 10 dagen']].map(function(d){return '<button type="button" data-act="skip" data-v="'+d[0]+'" aria-pressed="'+(S.skip===d[0])+'">'+T(d[1])+'</button>'}).join('')+'</div>'
    +'<span>'+T('{0} gesprekken nog te scheiden',n.sort)+' · '+T('{0} ruimtes deels buiten het archief',n.arch)+' · '+T('{0} telefoongesprekken nog niet beoordeeld',n.c)+'</span>';
  document.getElementById('win').innerHTML=({chat:chatView,kan:kanView,arch:archView,tech:techView,groei:groeiView})[S.view]();
  document.getElementById('hood').innerHTML='<b>'+T('Onder de motorkap')+'</b><code>'+esc(S.wire)+'</code>';
  document.getElementById('foot').innerHTML='<span>MAIA · '+T('demo versie {0}, {1}',DEMO.v,DEMO.d)+'</span><span>'+T('Onderdeel van XENA, naast de opslag, MIRA, TINA en ELSA.')+'</span><span>'+T('Alle voorbeeldgegevens zijn verzonnen.')+'</span>';
  var sa=document.getElementById('selall');if(sa)sa.indeterminate=sa.dataset.ind==='1';
  modal()}
function w(s){S.wire=s}
var wt=t;
function capWire(c,m){var ch=CHB[c.ch],k=ch.k,st=mstate(c,m);
  if(c.ch==='talk')return 'POST /ocs/v2.php/apps/spreed/api/v1/chat/… → 201 · Nextcloud → '+wt('register')+' '+m.pid+(st==='pers'?' · '+wt('versleuteld met jouw persoonlijke sleutel'):' · '+wt('objectopslag (S3, Object Lock)'));
  if(k==='A2')return 'PUT /_matrix/client/v3/rooms/…/send/m.room.encrypted → 200 · '+(st==='arch'?wt('archiefdeelnemer ontvangt en ontsleutelt')+' · WebDAV PUT → Nextcloud → '+wt('register')+' '+m.pid:wt('geen archiefdeelnemer in deze ruimte: niet in het archief'));
  if(c.ch==='teams')return 'POST /chats/…/messages → 201 · Graph change notification → '+wt('brug')+' → Nextcloud → '+wt('register')+' '+m.pid+' ('+wt('kopie')+')';
  if(c.ch==='slack')return 'chat.postMessage → ok · Events API message → '+wt('brug')+' → Nextcloud → '+wt('register')+' '+m.pid+' ('+wt('kopie')+')';
  if(c.ch==='wa')return 'POST /{phone-number-id}/messages (Cloud API) → 200 · '+wt('brug')+' → Nextcloud → '+wt('register')+' '+m.pid+' ('+wt('kopie')+')';
  return 'Signal: '+wt('verstuurd vanaf het toestel')+' · '+wt('niet in het archief tot je het vastlegt')}
var A={
  view:function(e){S.view=e.dataset.v;w(S.view==='chat'?capWire(BY[S.sel],lastMsg(BY[S.sel])):S.view==='kan'?wt('Vier klassen, één register'):S.view==='arch'?wt('Eén object in de opslag, vier soorten aanvoer'):S.view==='tech'?wt('Elke aanvoer eindigt in een WebDAV-schrijfactie in Nextcloud'):wt('Het archief verhuist nooit; alleen de bron verandert'));render()},
  ch:function(e){S.ch=e.dataset.v;S.sel=convs(S.ch)[0].id;S.pick={};if(S.anon&&S.anon.indexOf('ok:')<0)S.anon=null;var c=BY[S.sel];w(CHB[S.ch].n+' · '+wt(CHB[S.ch].cap));render()},
  sel:function(e){S.sel=e.dataset.id;S.pick={};S.pm='ges';if(S.anon!==S.sel)S.anon=null;var c=BY[S.sel];w('GET /register/gesprekken/'+c.gid+' → '+wt('{0} berichten in het archief',c.msgs.filter(function(m){return mstate(c,m)==='arch'}).length));render()},
  go:function(e){var c=BY[e.dataset.id];S.ch=c.ch;A.sel(e)},
  pm:function(e){S.pm=e.dataset.v;render()},
  pane:function(){S.pane=!S.pane;render()},
  skip:function(e){S.skip=+e.dataset.v;w(S.skip?wt('Demo: {0} dagen later',S.skip)+' · '+wt('MAIA zet niet-gescheiden gesprekken na tien dagen op zakelijk'):'—');render()},
  aard:function(e){var c=BY[S.sel],v=e.dataset.v||null;c.aard=v;c.auto=false;
    if(v==='persoonlijk'){c.hist.push(CHB[c.ch].k==='C'?'Gemarkeerd als persoonlijk':'Aangemerkt als persoonlijk en versleuteld');w(CHB[c.ch].k==='C'?wt('Register: gesprek beoordeeld als persoonlijk · niets vastgelegd'):'PROPPATCH '+wt('register')+' '+c.gid+' → '+wt('aard: persoonlijk')+' · '+wt('berichten versleuteld met jouw persoonlijke sleutel')+' · '+wt('buiten het Woo-zoekbereik'));toast(t(CHB[c.ch].k==='C'?'Gemarkeerd als persoonlijk. Er wordt niets vastgelegd.':'Persoonlijk. Alleen jij kunt de berichten in het archief lezen.'))}
    else if(v==='zakelijk'&&CHB[c.ch].k==='C'){c.hist.push('Aangemerkt als zakelijk');w(wt('Register: gesprek beoordeeld als zakelijk')+' · '+wt('niets in het archief tot je de berichten vastlegt'));toast(t('Zakelijk. Selecteer de zakelijke berichten en leg ze vast.'))}
    else if(v==='zakelijk'){c.hist.push('Aangemerkt als zakelijk');w('PROPPATCH '+wt('register')+' '+c.gid+' → '+wt('aard: zakelijk')+' · '+wt('bewaartermijn vastgelegd')+' · '+wt('Object Lock zodra de bedenktijd voorbij is'));toast(t('Vastgelegd als zakelijk.'))}
    else{c.hist.push('Opnieuw te beoordelen');w('—')}
    render()},
  invite:function(){var c=BY[S.sel];c.arch=true;c.archFrom=c.msgs.length;addMsg(c,{w:'arc',at:fmtT(now()),tx:'Archief · Gemeente Haarlem doet mee aan deze ruimte. Nieuwe berichten worden gearchiveerd.',sys:true});c.hist.push('Archiefdeelnemer uitgenodigd');
    w('POST /_matrix/client/v3/rooms/…/invite {"user_id":"@archief:haarlem.gemeente.org"} → 200 · '+wt('lid van de ruimte, zichtbaar voor iedereen')+' · '+wt('sleutels in de sleutelkluis'));toast(t('De archiefdeelnemer doet mee. Nieuwe berichten komen in het archief; eerdere berichten kan hij niet lezen.'));render()},
  capprev:function(){var c=BY[S.sel],n=0;c.msgs.forEach(function(m){if(mstate(c,m)==='none'){m.cap=true;m.via='client';n++}});c.hist.push('Eerdere berichten vastgelegd vanaf de client');
    w(wt('Client ontsleutelt {0} berichten met de eigen sleutels',n)+' · '+wt('via de integratielaag')+' · WebDAV PUT → Nextcloud → '+wt('register')+' · '+wt('herkomst: vastgelegd door {0}',ME.name));toast(t('{0} eerdere berichten vastgelegd.',n));render()},
  capsel:function(){var c=BY[S.sel],L=picked(c).filter(function(m){return mstate(c,m)==='none'}),k=CHB[c.ch].k;L.forEach(function(m){m.cap=true;m.via=k==='C'?'share':'client'});if(k==='C'&&!c.aard)c.aard='zakelijk';
    c.hist.push(k==='C'?'Selectie vastgelegd via het deelmenu, met verklaring':'Selectie vastgelegd vanaf de client');S.pick={};
    w((k==='C'?wt('Deelmenu → MAIA-app')+' · ':'')+wt('via de integratielaag')+' · WebDAV PUT → Nextcloud → '+wt('register')+' nl.haarlem.io:'+hex(4,L.length*91+7)+'-… · '+wt('{0} berichten in één informatieobject',L.length)+(k==='C'?' · '+wt('verklaring van {0}',ME.name):''));toast(t('{0} berichten vastgelegd als informatieobject.',L.length));render()},
  clr:function(){S.pick={};render()},
  sugz:function(){var c=BY[S.sel];link(c,'zaak',c.sug.z)},
  unl:function(e){var c=BY[S.sel],k=e.dataset.k,v=e.dataset.v;if(k==='zaak'){c.zaak='';w('DELETE /zaken/api/v1/zaakinformatieobjecten/… → 204 · '+wt('kenmerk verwijderd uit het register'))}else{c.doss=c.doss.filter(function(d){return d!==v});w(wt('Register: verwijzing {0} → {1} ingetrokken',v,c.gid))}c.hist.push('Ontkoppeld');toast(t('Ontkoppeld van {0}.',v));render()},
  vsl:function(){var c=BY[S.sel],n=c.msgs.filter(function(m){return mstate(c,m)==='arch'}).length;c.vsl=now();c.vsl_n=n;c.hist.push('Gespreksverslag gemaakt');
    w('GET /register/gesprekken/'+c.gid+'/berichten → '+n+' · '+wt('weergave als PDF/A-2')+' · '+wt('waarmerk namens de gemeente')+' · '+wt('relatie naar elk bericht, geen kopie'));toast(t('Gespreksverslag gemaakt en gewaarmerkt.'));render()},
  anon:function(){var c=BY[S.sel];S.anon=S.anon===c.id?null:c.id;if(S.anon)w(wt('Voorbeeld van anonimiseren')+' · '+wt('naam, telefoonnummer en adres van de inwoner')+' · '+wt('nog niet bevestigd'));render()},
  anonok:function(){var c=BY[S.sel];c.anonOk=true;c.hist.push('Anonimiseren bevestigd');w('POST /register/'+c.gid+'/weergaven {"soort":"geanonimiseerd"} → 201 · '+wt('origineel ongewijzigd'));toast(t('Bevestigd. De geanonimiseerde weergave is klaar voor de Woo.'));render()},
  send:function(){var f=document.getElementById('cmp'),v=(f&&f.value||'').trim(),c=BY[S.sel];if(!v){if(f)f.focus();return}
    var m=addMsg(c,{w:'me',at:fmtT(now()),tx:v,lit:true});w(capWire(c,m));render();var g=document.getElementById('cmp');if(g)g.focus();var L=document.querySelector('.msgs');if(L)L.scrollTop=L.scrollHeight},
  ah:function(e){S.ah=+e.dataset.i;w(wt(SEQ[S.ah].t)+' · '+wt('{0} stappen',SEQ[S.ah].s.length));render()},
  colofon:function(){S.colo=true;render()},
  coloX:function(){S.colo=false;render()}
};
function addMsg(c,m){var i=c.msgs.length;m.id=c.id+'-'+i;m.n=i;m.pid=pidOf(c.id,i);c.msgs.push(m);return m}
function link(c,k,v){if(!v)return;if(k==='zaak'){c.zaak=v;c.hist.push('Gekoppeld aan een zaak');w('POST /zaken/api/v1/zaakinformatieobjecten → 201 · '+wt('zaak {0} als kenmerk in het register',v)+' · '+wt('het zaaksysteem blijft leidend'));toast(t('Gekoppeld aan zaak {0}.',v))}
  else{if(c.doss.indexOf(v)<0)c.doss.push(v);c.hist.push('Opgenomen in een dossier');w(wt('Register: verwijzing {0} → {1}',v,c.gid)+' · '+wt('geen kopie'));toast(t('Opgenomen in dossier {0}.',v))}render()}
document.addEventListener('click',function(ev){if(ev.target.id==='layer'&&S.colo){S.colo=false;render();return}
  var e=ev.target.closest&&ev.target.closest('[data-act]');if(!e||e.disabled)return;var f=A[e.dataset.act];if(f)f(e)});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.colo){S.colo=false;render();return}
  if(ev.key==='Enter'&&ev.target.id==='cmp'){ev.preventDefault();A.send()}});
document.addEventListener('change',function(ev){var e=ev.target;
  if(e.id==='lang'){setLang(e.value,true);render();return}
  if(e.id==='selall'){var cc=BY[S.sel];S.pick={};if(e.checked)cc.msgs.forEach(function(m){if(!m.sys)S.pick[m.id]=true});render();return}
  if(e.dataset&&e.dataset.pick){if(e.checked)S.pick[e.dataset.pick]=true;else delete S.pick[e.dataset.pick];render();return}
  if(e.dataset&&e.dataset.f){var c=BY[S.sel],k=e.dataset.f,v=e.value;if(!v)return;
    if(k==='pd'){var L=picked(c);c.hist.push('Selectie opgenomen in een dossier');S.pick={};w(wt('Register: dossier {0} verwijst naar {1} berichten',v,L.length)+' · '+L.map(function(m){return m.pid}).slice(0,2).join(', ')+(L.length>2?', …':'')+' · '+wt('geen kopie'));toast(t('{0} berichten opgenomen in dossier {1}.',L.length,v));render();return}
    link(c,k==='zaak'?'zaak':'dos',v)}});
var EXTRA=['Na tien dagen automatisch zakelijk','Aangemerkt als persoonlijk en versleuteld','Gemarkeerd als persoonlijk','Aangemerkt als zakelijk','Opnieuw te beoordelen','Archiefdeelnemer uitgenodigd','Eerdere berichten vastgelegd vanaf de client','Selectie vastgelegd via het deelmenu, met verklaring','Selectie vastgelegd vanaf de client','Ontkoppeld','Gespreksverslag gemaakt','Anonimiseren bevestigd','Gekoppeld aan een zaak','Opgenomen in een dossier','Selectie opgenomen in een dossier','telefoonnummer','naam','adres'];
window.__maia={strings:function(){var o=EXTRA.slice();CH.forEach(function(c){o.push(KL[c.k],c.gen,c.orig,c.cap,c.vol,c.kb,c.where)});
  CONV.forEach(function(c){if(!c.lit)o.push(c.ti);o.push(c.sub);if(c.sug)o.push(c.sug.why);c.msgs.forEach(function(m){if(!m.lit&&!c.lit||m.sys)o.push(m.tx);if(m.ed)o.push(m.ed)})});
  Object.keys(PP).forEach(function(k){if(PP[k][1])o.push(PP[k][1])});ZAKEN.forEach(function(r){o.push(r[1])});DOSSIERS.forEach(function(r){o.push(r[1],r[2])});
  SEQ.forEach(function(q){o.push(q.t);o=o.concat(q.s)});GP.forEach(function(x){o.push(x.t,x.tv,x.see,x.pf,x.mk,x.ms);if(x.lab)o.push(x.lab)});VIEWS.forEach(function(v){o.push(v[1])});
  Object.keys(STL).forEach(function(k){o.push(STL[k][0])});return o},state:S,conv:CONV};
(function(){var l='';try{l=localStorage.getItem('maia.lang')||''}catch(e){}var h=(location.hash||'').slice(1).toLowerCase();if(LANGS[h])l=h;setLang(l||'nl')})();
render();
})();
</script>
