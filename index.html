<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="generator" content="MAIA (chatarchief), demo versie 2, 20-10-2026">
<title>MAIA</title>
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: demokader met tabbladen; vormtaal gelijk aan XENA, MIRA, TINA en ELSA. */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --green:#1b6f3f; --green-soft:#def2e5; --blue:#2c5c9c; --blue-soft:#e1eaf7;
  --app:#0f6cbd; --shadow:0 10px 30px rgba(10,40,46,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1360px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-size:17px;font-weight:600}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;white-space:nowrap}
.ttl .sub{color:var(--muted);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);font-weight:500;background:var(--surface);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sel)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.regie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;font-size:12.5px;color:var(--muted)}
.regie b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.regie .seg button{padding:3px 10px;font-size:12.5px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.page{padding:20px 22px 26px;display:grid;gap:16px}
.page h2{font-size:19px;font-weight:600;text-wrap:balance}
.lead{max-width:72ch;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.n-amber{background:var(--amber-soft);color:var(--amber)} .n-violet{background:var(--violet-soft);color:var(--violet)} .n-green{background:var(--green-soft);color:var(--green)} .n-grey{background:var(--surface2);color:var(--fg)} .n-red{background:var(--red-soft);color:var(--red)}
.note span{color:var(--fg)} .note svg{margin-top:2px}

/* mailprogramma */
.mc-top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--app);color:#fff;font-size:12.5px;flex-wrap:wrap}
.mc-top b{font-weight:600}.mc-top .acc{margin-left:auto;opacity:.92}
.mc-bar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.mc-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.tb{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;font-size:12.5px;color:var(--fg)}
.tb:hover:not(:disabled){background:var(--sel)} .tb:disabled{opacity:.45;cursor:default} .tb svg{color:var(--app)}
.mc-bar select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.mc-bar input[type=search]{flex:1 1 200px;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.mc{display:grid;grid-template-columns:190px 290px minmax(0,1fr) 340px;min-height:580px}.mc.nopane{grid-template-columns:190px 300px minmax(0,1fr)}
.tag{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-violet{color:var(--violet)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ap{display:flex;border-left:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 30%,var(--surface));min-width:0;max-height:640px}
.ap.off{display:block;background:var(--surface2);overflow:auto}
.apm{flex:1;min-width:0;overflow:auto}
.aph{position:sticky;top:0;display:flex;gap:9px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);border-left:3px solid var(--accent);z-index:1}
.aph h3{font-size:13.5px}.aph p{font-size:11.5px;color:var(--muted)}.aph svg{color:var(--accent)}
.apb{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:13px}.apb>*{min-width:0}.apb h3{font-size:14px}.apb h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px}.apb h4 b{color:var(--fg)}
.apl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.apl li{min-width:0}.apl button{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}.apl button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apl button:hover{border-color:var(--accent)}
.apl .gn{display:grid;gap:1px;text-align:left}.apl .gn small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apl .gs{color:var(--amber);flex:none}
.gchips{display:flex;flex-wrap:wrap;gap:4px}.gchips button{padding:2px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px}.gchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.gme{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gme svg{color:var(--accent);flex:none}.gme div{flex:1;min-width:0;display:grid}.gme span{font-size:12px;color:var(--muted)}.gme .btn{padding:4px 10px;font-size:12.5px}
.gback{justify-self:start;color:var(--accent);font-size:12.5px;padding:2px 0}.gback:hover{text-decoration:underline}
.gcard{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gav{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.gcard h3{font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.gcard p{font-size:12.5px;color:var(--muted)}
.gdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px}.gdl dt{color:var(--muted)}.gdl dd{margin:0;overflow-wrap:anywhere}
.gact{display:flex;flex-wrap:wrap;gap:6px}.gact .btn{padding:5px 10px;font-size:12.5px}.gact [aria-pressed="true"] path{fill:currentColor}.gact [aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
.gsh{display:grid;gap:6px}.gsh label{display:flex;gap:8px;align-items:center;font-size:13px}.gsh input{accent-color:var(--accent)}
.apr{width:44px;flex:none;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:2px;padding:6px 0}
.apr button{position:relative;height:38px;display:grid;place-items:center;color:var(--accent)}.apr button:hover{background:var(--surface)}
.apr button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
.apr i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9.5px;font-weight:600;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 4px}
.ap .el{border:0;background:none;padding:12px 14px}.ap .meta{grid-template-columns:minmax(0,1fr)}.ap .el .q{flex-direction:column;align-items:stretch}.ap .el .q .btn{justify-content:center}
.fold{border-right:1px solid var(--line);padding:8px 0;background:var(--surface2);font-size:13px}
.fold h4{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 14px 4px;font-weight:600}
.fold button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 14px}
.fold button:hover{background:var(--sel)} .fold button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fold button span{flex:1;min-width:0} .fold button b{font-size:11.5px;font-weight:600;color:var(--app)}
.fold .gr{padding:10px 14px 0;font-size:11.5px;color:var(--muted)}
.list{border-right:1px solid var(--line);overflow:auto;max-height:640px}
.mi{display:grid;gap:2px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left}
.mi:hover{background:var(--surface2)} .mi[aria-current="true"]{background:var(--sel);border-left-color:var(--app)}
.mi .r1{display:flex;gap:6px;align-items:baseline}.mi .r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mi.read .r1 b{font-weight:500}
.mi .r1 time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mi .sj{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .pv{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.empty{padding:30px 16px;color:var(--muted);text-align:center;font-size:13px}
.read-p{overflow:auto;max-height:640px;display:flex;flex-direction:column}
.el{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));padding:10px 16px;display:grid;gap:8px}
.el .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.el .h b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.el .q{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.el .q strong{font-weight:600}
.el .sug{font-size:12.5px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fld{display:grid;gap:3px;font-size:12.5px}
.fld label{font-weight:500}
.fld select,.fld input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.fld .ro{padding:5px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.msg{padding:16px 18px 22px;display:grid;gap:10px}
.msg h2{font-size:18px;font-weight:600;text-wrap:balance}
.mh{display:grid;grid-template-columns:70px minmax(0,1fr);gap:3px 10px;font-size:13px}
.mh dt{color:var(--muted)} .mh dd{overflow-wrap:anywhere}
.body{font-family:var(--serif);font-size:14.5px;line-height:1.6;max-width:66ch;display:grid;gap:8px}
.enc{border:1px dashed var(--violet);border-radius:8px;padding:16px;color:var(--violet);display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--violet-soft)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:100%}
.att small{display:block;color:var(--muted);font-size:11px}
.ref{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}

/* doorstroom */
.steps{display:grid;gap:0}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.stp .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600;background:var(--surface)}
.stp.done .dot{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.stp.now .dot{border-color:var(--accent);color:var(--accent)}
.stp b{font-size:14px}.stp p{font-size:12.5px;color:var(--muted)}
.stp time{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.stp code{display:block;margin-top:4px;font-family:var(--mono);font-size:11.5px;background:var(--surface2);border-radius:6px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}

/* filters */
.rule{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.rule .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rule .r1 b{flex:1;min-width:0}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
pre.sv{margin:0;font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.rules{display:grid;gap:8px}
.lim{display:grid;gap:6px;font-size:13px}.lim li{display:flex;gap:8px;align-items:flex-start}

/* adresboek */
.ab{width:100%;border-collapse:collapse;font-size:13px}
.ab th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 10px;background:var(--surface2);white-space:nowrap}
.ab td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.ab td small{display:block;color:var(--muted);font-size:11.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.share{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.share label{display:flex;gap:8px;align-items:center;font-size:13px}
.share input{accent-color:var(--accent)}
.srch{display:flex;gap:8px;flex-wrap:wrap}.srch input{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* sleutels */
.req{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;justify-items:start}.req dl{justify-self:stretch}
.req dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:3px 10px;font-size:13px}.req dt{color:var(--muted)}
.log{display:grid;gap:4px;font-size:12.5px}.log li{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px}.log time{color:var(--muted);font-family:var(--mono);font-size:11.5px}

/* architectuur */
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.zone{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.zone>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.bx{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--blue-soft);display:grid;gap:2px}
.bx b{font-size:13.5px}.bx small{font-size:12px;color:var(--muted)}
.bx.u{background:var(--surface2)}
.flow{display:grid;gap:6px;font-size:13px}.flow li{display:flex;gap:10px;align-items:baseline}.flow li i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none;width:22px}
.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.open div{border-left:3px solid var(--amber);padding:2px 0 2px 12px;display:grid;gap:3px}.open b{font-size:14px}.open span{font-size:13px;color:var(--muted)}

.hood{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:6px 12px}
.hood b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex:none}
.hood code{flex:1 1 300px;min-width:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:20;max-width:min(400px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}
#layer:empty{display:none}
#layer{position:fixed;inset:0;background:rgba(8,24,28,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:600px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;display:grid;gap:12px}
.dlg h2{font-size:16px}
/* colofon */
@property --ca{syntax:'<angle>';inherits:false;initial-value:0deg}
.dlg.colo{max-width:640px;padding:0;gap:0;display:flex;flex-direction:column;position:relative;overflow:hidden;isolation:isolate;border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ca,0deg),var(--accent),var(--violet),var(--amber),var(--green),var(--accent)) border-box;animation:clBorder 8s linear infinite}
.colo .cfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1;border-radius:inherit}
.colo .cin{overflow:auto;min-height:0;flex:1}
.colo .aur{position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:.32;filter:blur(40px);background:radial-gradient(closest-side at 30% 30%,var(--accent),transparent 70%),radial-gradient(closest-side at 70% 40%,var(--violet),transparent 70%),radial-gradient(closest-side at 50% 75%,var(--amber),transparent 70%);animation:clAur 18s ease-in-out infinite alternate}
.colo .sp{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none;z-index:0;animation:clSp 6s ease-in-out infinite}
.colo .chead{display:flex;gap:16px;align-items:center;padding:18px 18px 4px}
.colo .seal{flex:none;width:96px;height:96px;position:relative}
.colo .seal svg.ring{position:absolute;inset:0;animation:clSpin 28s linear infinite}
.colo .seal text{font:600 8.4px var(--mono,monospace);letter-spacing:.18em;fill:var(--accent)}
.colo .seal svg.core{position:absolute;inset:22px;width:52px;height:52px}
.colo .seal .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:clDraw 1.6s .3s ease-out forwards}
.colo h2.ct{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;background:linear-gradient(100deg,var(--fg) 20%,var(--accent) 40%,var(--violet) 50%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:clShine 6s ease-in-out infinite}
.colo .csub{color:var(--muted);font-size:12.5px;margin-top:2px}
.colo .mb{padding:10px 18px 4px}
.colo dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13px}
.colo dt{color:var(--muted)}
.colo dd{margin:0;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}
.colo dd small{color:var(--muted);font-size:12px}
.colo dd ul{list-style:disc;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.colo dd li{display:list-item;border:0;padding:0}
.colo dd a{color:var(--accent)}
.colo .sel{user-select:all;font-family:var(--mono);font-size:12px}
.colo .cl{opacity:0;transform:translateY(8px);animation:clIn .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*85ms + 250ms)}
.colo .cnote{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;color:var(--muted);font-size:12px}
.colo .cfoot{display:flex;justify-content:flex-end;padding:10px 18px 16px}
@media (max-width:560px){.colo .chead{flex-direction:column;align-items:flex-start}.colo dl{grid-template-columns:1fr;gap:2px}.colo dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){.dlg.colo,.colo .aur,.colo .sp,.colo .seal svg.ring,.colo h2.ct{animation:none}.colo .cl{animation:none;opacity:1;transform:none}.colo .seal .draw{animation:none;stroke-dashoffset:0}}
@keyframes clBorder{to{--ca:360deg}}
@keyframes clAur{0%{transform:translate(-6%,-4%) rotate(0deg) scale(1)}100%{transform:translate(6%,5%) rotate(25deg) scale(1.12)}}
@keyframes clSp{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
@keyframes clSpin{to{transform:rotate(360deg)}}
@keyframes clDraw{to{stroke-dashoffset:0}}
@keyframes clShine{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes clIn{to{opacity:1;transform:none}}

@media (max-width:1200px){.cc,.cc.nopane{grid-template-columns:190px 250px minmax(0,1fr)}.cc .ap{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}.kcards{grid-template-columns:repeat(2,minmax(0,1fr))}}

}

ver":"Application Service auf dem eigenen Server","Archief":"Archiv","Archief · Gemeente Haarlem doet mee aan deze ruimte. Nieuwe berichten worden gearchiveerd.":"Archiv · Gemeinde Haarlem nimmt an diesem Raum teil. Neue Nachrichten werden archiviert.","Archief · Gemeente Haarlem is lid van deze ruimte. Iedereen ziet dat; het ontvangt nieuwe berichten als deelnemer en ontsleutelt ze met sleutels uit de sleutelkluis van de gemeente.":"Archiv · Gemeinde Haarlem ist Mitglied dieses Raums. Alle sehen das; das Archiv empfängt neue Nachrichten als Teilnehmer und entschlüsselt sie mit Schlüsseln aus dem Schlüsseltresor der Gemeinde.","Archiefdeelnemer":"Archivteilnehmer","Archiefdeelnemer uitgenodigd":"Archivteilnehmer eingeladen","Archiefdeelnemer uitnodigen":"Archivteilnehmer einladen","Archiefdeelnemer: drie manieren":"Archivteilnehmer: drei Wege","Archiefdeelnemer: een Matrix-gebruiker van de gemeente":"Archivteilnehmer: ein Matrix-Benutzer der Gemeinde","Archiefdienst en sleutelbeheer.":"Archivdienst und Schlüsselverwaltung.","Archiefdienst met sleutelbeheer, uitnodigen per zakelijke ruimte, afspraken over federatie":"Archivdienst mit Schlüsselverwaltung, Einladung je dienstlichem Raum, Vereinbarungen zur Föderation","Architectuur":"Architektur","Assistent":"Assistent","A′ · archiefdeelnemer":"A′ · Archivteilnehmer","A′ · eigen beheer, versleuteld":"A′ · selbst betrieben, verschlüsselt","B · koppelingen":"B · Anbindungen","B · leverancier":"B · Anbieter","Bas Mulder":"Bas Mulder","Beide versies in het archief":"Beide Versionen im Archiv","Bericht":"Nachricht","Bericht in een chatdienst van een leverancier":"Nachricht in einem Chatdienst eines Anbieters","Bericht in een versleutelde Matrix-ruimte":"Nachricht in einem verschlüsselten Matrix-Raum","Bericht in een zakelijke Talk-ruimte":"Nachricht in einem dienstlichen Talk-Raum","Bericht van een inwoner":"Nachricht eines Einwohners","Berichtenapp op het toestel":"Messenger-App auf dem Gerät","Berichtendienst voor inwonercontact":"Messaging-Dienst für den Einwohnerkontakt","Bestuurlijke informatie wethouder Mulder":"Leitungsinformation Beigeordneter Mulder","Bestuurlijke keuze":"Entscheidung der Verwaltungsleitung","Bestuursdossier":"Leitungsakte","Bevestigd. De geanonimiseerde versie is een eigen weergave; het origineel blijft ongewijzigd in het archief.":"Bestätigt. Die anonymisierte Fassung ist eine eigene Ansicht; das Original bleibt unverändert im Archiv.","Bevestigd. De geanonimiseerde weergave is klaar voor de Woo.":"Bestätigt. Die anonymisierte Ansicht ist bereit für die Woo.","Bevestigen":"Bestätigen","Bewaartermijnen":"Aufbewahrungsfristen","Bewerken en verwijderen":"Bearbeiten und Löschen","Bewerking":"Bearbeitung","Bewerkingen als nieuwe versie; verwijderde berichten zijn maar korte tijd op te halen":"Bearbeitungen als neue Version; gelöschte Nachrichten sind nur kurze Zeit abrufbar","Bewerkingen en verwijderingen zijn eigen events; het archief bewaart ze allebei":"Bearbeitungen und Löschungen sind eigene Events; das Archiv bewahrt beide auf","Bewijskracht":"Beweiskraft","Bezwaar leges dakkapel Kleverlaan 30":"Widerspruch Gebühren Dachgaube Kleverlaan 30","Bezwaar omgevingsvergunning Kleverlaan 12":"Widerspruch Umgebungsgenehmigung Kleverlaan 12","Bij de gemeente, end-to-end versleuteld op de eigen Matrix-server":"Bei der Gemeinde, Ende-zu-Ende-verschlüsselt auf dem eigenen Matrix-Server","Bij de gemeente, in de Nextcloud-stack van XENA":"Bei der Gemeinde, im Nextcloud-Stack von XENA","Bij de leverancier":"Beim Anbieter","Bij de leverancier en op de telefoon van de inwoner":"Beim Anbieter und auf dem Telefon des Einwohners","Bij de leverancier, in Microsoft 365":"Beim Anbieter, in Microsoft 365","Bij een zakelijk gesprek uit het zicht, niet uit het archief. Het register legt vast wie het wanneer deed.":"Bei einem dienstlichen Gespräch aus dem Blick, nicht aus dem Archiv. Das Register hält fest, wer es wann getan hat.","Bijlage":"Anhang","Bijlagen":"Anhänge","Bijlagen staan in de samenwerkomgeving; het register verwijst naar het bestand als eigen informatieobject.":"Anhänge liegen in der Kollaborationsumgebung; das Register verweist auf die Datei als eigenes Informationsobjekt.","Bijvoorbeeld Nextcloud Talk":"Zum Beispiel Nextcloud Talk","Bijvoorbeeld Signal":"Zum Beispiel Signal","Bijvoorbeeld Teams of Slack, en een berichtendienst voor inwonercontact":"Zum Beispiel Teams oder Slack sowie ein Messaging-Dienst für den Einwohnerkontakt","Bouwbedrijf De Vaart":"Baufirma De Vaart","Breek nooit de versleuteling om te kunnen archiveren":"Brechen Sie nie die Verschlüsselung, um archivieren zu können","Brug voor de Cloud API, anonimiseren voor de Woo.":"Brücke für die Cloud API, Anonymisieren für die Woo.","C · deelmenu":"C · Teilen-Menü","C · toestel":"C · Gerät","Centraal beheer, zonder extra client":"Zentrale Verwaltung, ohne zusätzlichen Client","Chat":"Chat","Chatarchivering binnen XENA":"Chat-Archivierung in XENA","Chatberichten aan de bron in het archief.":"Chatnachrichten an der Quelle im Archiv.","Chatberichten archiveren in XENA: uit elk kanaal in hetzelfde register, met de assistent naast het gesprek.":"Chatnachrichten in XENA archivieren: aus jedem Kanal in dasselbe Register, mit dem Assistenten neben dem Gespräch.","Chatdienst van een leverancier":"Chatdienst eines Anbieters","Chatomgeving in eigen beheer":"Selbst betriebene Chatumgebung","Client ontsleutelt {0} berichten met de eigen sleutels":"Client entschlüsselt {0} Nachrichten mit den eigenen Schlüsseln","Cloud API: webhooks voor binnenkomend, de API voor verzenden":"Cloud API: Webhooks für eingehende Nachrichten, die API zum Senden","Colofon":"Impressum","Commune de Port-Saint-Exemple":"Commune de Port-Saint-Exemple","Concept. Dit is een volgorde, geen planning. Register en objectopslag staan er vanaf stap 1 en veranderen daarna niet meer: het archief verhuist nooit, alleen de bron van de berichten verandert.":"Entwurf. Dies ist eine Reihenfolge, kein Zeitplan. Register und Objektspeicher stehen ab Schritt 1 und ändern sich danach nicht mehr: Das Archiv zieht nie um, nur die Quelle der Nachrichten ändert sich.","Contact":"Kontakt","Contact met een inwoner is altijd zakelijk.":"Kontakt mit Einwohnern ist immer dienstlich.","Copyright":"Urheberrecht","Daar loopt een bezwaar tegen. Ik stuur je het zaaknummer.":"Dagegen läuft ein Widerspruch. Ich schicke dir das Vorgangszeichen.","Dan pas ik de terrasvergunningen aan.":"Dann passe ich die Terrassengenehmigungen an.","Dank u. Mijn man is bereikbaar op 06 98765432 als u ons wilt bellen.":"Danke. Mein Mann ist unter 06 98765432 erreichbar, falls Sie uns anrufen möchten.","De MAIA-app met het deelmenu.":"Die MAIA-App mit dem Teilen-Menü.","De MAIA-app vraagt om het gesprek, de deelnemers en een korte verklaring.":"Die MAIA-App fragt nach dem Gespräch, den Teilnehmenden und einer kurzen Erklärung.","De Matrix-server bewaart en verspreidt het, zonder het te kunnen lezen.":"Der Matrix-Server speichert und verteilt sie, ohne sie lesen zu können.","De archiefdeelnemer doet mee. Nieuwe berichten komen in het archief; eerdere berichten kan hij niet lezen.":"Der Archivteilnehmer ist dabei. Neue Nachrichten kommen ins Archiv; frühere Nachrichten kann er nicht lesen.","De archiefdeelnemer ontvangt het als lid van de ruimte en ontsleutelt het in de archiefdienst, met sleutels uit de sleutelkluis.":"Der Archivteilnehmer empfängt sie als Mitglied des Raums und entschlüsselt sie im Archivdienst, mit Schlüsseln aus dem Schlüsseltresor.","De archiefdienst schrijft het bericht via WebDAV in Nextcloud, met het oorspronkelijke Matrix-event erbij.":"Der Archivdienst schreibt die Nachricht über WebDAV in Nextcloud, zusammen mit dem ursprünglichen Matrix-Event.","De architectuurvisie waarop deze demo is gebaseerd; naast MIRA, TINA en ELSA":"Die Architekturvision, auf der diese Demo beruht; neben MIRA, TINA und ELSA","De berichten staan alleen op de telefoons van de deelnemers. Er is geen koppeling; de medewerker legt zelf vast wat zakelijk is.":"Die Nachrichten liegen nur auf den Telefonen der Teilnehmenden. Es gibt keine Anbindung; die Mitarbeiterin erfasst selbst, was dienstlich ist.","De berichtendienst stuurt een webhook naar het meldpunt; de brug schrijft het in Nextcloud.":"Der Messaging-Dienst schickt einen Webhook an den Empfangsendpunkt; die Brücke schreibt die Nachricht in Nextcloud.","De chat draait bij een leverancier. Via een koppeling krijgt XENA een archiefwaardige kopie; het origineel blijft buiten de gemeente.":"Der Chat läuft bei einem Anbieter. Über eine Anbindung erhält XENA eine archivwürdige Kopie; das Original bleibt außerhalb der Gemeinde.","De chat draait in de Nextcloud-stack van de gemeente. Het bericht is aan de bron een informatieobject; een kopie is niet nodig.":"Der Chat läuft im Nextcloud-Stack der Gemeinde. Die Nachricht ist an der Quelle ein Informationsobjekt; eine Kopie ist nicht nötig.","De chat draait op een Matrix-server van de gemeente of van een andere overheid. De server kan de berichten niet lezen. Een zichtbare archiefdeelnemer, met sleutels van de gemeente, legt ze vast.":"Der Chat läuft auf einem Matrix-Server der Gemeinde oder einer anderen Behörde. Der Server kann die Nachrichten nicht lesen. Ein sichtbarer Archivteilnehmer mit Schlüsseln der Gemeinde erfasst sie.","De chat schrijft rechtstreeks in Nextcloud":"Der Chat schreibt direkt in Nextcloud","De inwoner stuurt een bericht naar het nummer van de gemeente.":"Der Einwohner schickt eine Nachricht an die Nummer der Gemeinde.","De klantcontactomgeving toont het bericht; de medewerker antwoordt daar.":"Die Kundenkontaktumgebung zeigt die Nachricht; die Mitarbeiterin antwortet dort.","De letter is de klasse: hoe het kanaal in het archief komt. Zie Kanalen.":"Der Buchstabe ist die Klasse: wie der Kanal ins Archiv kommt. Siehe Kanäle.","De leverancier stuurt een melding naar het meldpunt van de gemeente.":"Der Anbieter schickt eine Benachrichtigung an den Empfangsendpunkt der Gemeinde.","De medewerker antwoordt in de klantcontactomgeving van de gemeente, niet in een app op de eigen telefoon. Het paneel staat daar.":"Die Mitarbeiterin antwortet in der Kundenkontaktumgebung der Gemeinde, nicht in einer App auf dem eigenen Telefon. Dort ist die Seitenleiste.","De medewerker of de informatiebeheerder kiest Gespreksverslag maken.":"Die Mitarbeiterin oder der Records Manager wählt Gesprächsprotokoll erstellen.","De medewerker plaatst een bericht in Talk.":"Die Mitarbeiterin schreibt eine Nachricht in Talk.","De medewerker plaatst een bericht, bijvoorbeeld in Teams.":"Die Mitarbeiterin schreibt eine Nachricht, zum Beispiel in Teams.","De medewerker selecteert berichten op de telefoon en kiest Delen, dan MAIA.":"Die Mitarbeiterin wählt auf dem Telefon Nachrichten aus und tippt auf Teilen, dann auf MAIA.","De medewerkers van de gemeente zitten met Element in deze ruimte, de Franse partners met Tchap. Het paneel staat alleen bij de gemeente.":"Die Beschäftigten der Gemeinde sind mit Element in diesem Raum, die französischen Partner mit Tchap. Die Seitenleiste gibt es nur bei der Gemeinde.","De nieuwe planning voor de bestrating staat in de projectmap.":"Der neue Zeitplan für die Pflasterarbeiten liegt im Projektordner.","De planning voor de migratie van de projectschijf staat onder Bestanden.":"Der Zeitplan für die Migration des Projektlaufwerks liegt unter Dateien.","De rest van het gesprek blijft op het toestel en komt niet in het archief.":"Der Rest des Gesprächs bleibt auf dem Gerät und kommt nicht ins Archiv.","De selectie gaat via de integratielaag naar Nextcloud, als één informatieobject met de berichten erin.":"Die Auswahl geht über die Integrationsschicht an Nextcloud, als ein Informationsobjekt mit den Nachrichten darin.","De vraag of chatberichten in een soeverein platform als XENA kunnen, ook vanuit Teams":"Die Frage, ob Chatnachrichten in eine souveräne Plattform wie XENA gehören können, auch aus Teams","De zaak komt uit het zaaksysteem, dat leidend blijft. MAIA legt de koppeling vast als kenmerk in het register.":"Der Vorgang kommt aus dem Vorgangssystem, das maßgeblich bleibt. MAIA hält die Verknüpfung als Merkmal im Register fest.","De zoekindex neemt het op, binnen het zoekbereik voor de Woo.":"Der Suchindex nimmt sie auf, innerhalb des Woo-Suchbereichs.","Deelmenu → MAIA-app":"Teilen-Menü → MAIA-App","Deelnemer":"Teilnehmer","Deels niet in het archief":"Teilweise nicht im Archiv","Delen naar MAIA: vastleggen":"Mit MAIA teilen: erfassen","Demo":"Demo","Demo: {0} dagen later":"Demo: {0} Tage später","Deze ruimte gaat over werk, maar heeft geen archiefdeelnemer. De Matrix-server kan de berichten niet lezen, dus ze komen niet in het archief.":"In diesem Raum geht es um Arbeit, aber er hat keinen Archivteilnehmer. Der Matrix-Server kann die Nachrichten nicht lesen, also kommen sie nicht ins Archiv.","Deze ruimte heeft geen archiefdeelnemer. Wat je hier typt, komt niet in het archief.":"Dieser Raum hat keinen Archivteilnehmer. Was Sie hier schreiben, kommt nicht ins Archiv.","Dezelfde laag als voor de kantoorpakketten en de mail. Op de werkplek staan geen sleutels.":"Dieselbe Schicht wie für die Office-Pakete und die E-Mail. Am Arbeitsplatz liegen keine Schlüssel.","Direct":"Sofort","Dit bericht is verwijderd.":"Diese Nachricht wurde gelöscht.","Dit gesprek":"Dieses Gespräch","Doorgeven":"Weiterleiten","Doorsturen door de client":"Weiterleitung durch den Client","Duidelijke regels: werk in de chat van de gemeente. Wat toch via Signal gaat, leg je vast.":"Klare Regeln: Arbeit gehört in den Chat der Gemeinde. Was trotzdem über Signal läuft, erfassen Sie selbst.","Een Matrix-client, zoals Element in MijnBureau of Tchap in LaSuite":"Ein Matrix-Client, etwa Element in MijnBureau oder Tchap in LaSuite","Een Matrix-gebruiker van de gemeente in elke zakelijke ruimte; sleutels in de sleutelkluis":"Ein Matrix-Benutzer der Gemeinde in jedem dienstlichen Raum; Schlüssel im Schlüsseltresor","Een archiefdeelnemer is zichtbaar. Dat is de bedoeling, maar het vraagt uitleg aan collega’s van andere organisaties.":"Ein Archivteilnehmer ist sichtbar. Das ist gewollt, verlangt aber Erklärungen gegenüber Kolleginnen und Kollegen anderer Organisationen.","Een bijlage is een eigen informatieobject. Het bericht verwijst ernaar, er is geen kopie.":"Ein Anhang ist ein eigenes Informationsobjekt. Die Nachricht verweist darauf, es gibt keine Kopie.","Een chat naast de bestanden, met het paneel van de Office Assistent.":"Ein Chat neben den Dateien, mit der Seitenleiste des Office-Assistenten.","Een deelnemer verstuurt een versleuteld bericht.":"Ein Teilnehmer sendet eine verschlüsselte Nachricht.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, organisaties, telefoonnummers, dossiers en zaaknummers bestaan niet. Productnamen staan er om herkenbaar te zijn; de demo is niet door de leveranciers gemaakt of goedgekeurd.":"Eine Demo, kein Produkt. Alle Beispieldaten sind erfunden: Personen, Organisationen, Telefonnummern, Akten und Vorgangszeichen gibt es nicht. Produktnamen stehen nur zur Wiedererkennung da; die Demo wurde von den Anbietern weder erstellt noch freigegeben.","Een gedeeld Slack-kanaal met een ketenpartner archiveert de gemeente alleen in haar eigen werkruimte.":"Einen geteilten Slack-Kanal mit einem Kooperationspartner archiviert die Gemeinde nur in ihrem eigenen Workspace.","Een gesprek kan bij meer dan één zaak of dossier horen. De langste termijn gaat voor, zoals bij documenten.":"Ein Gespräch kann zu mehr als einem Vorgang oder einer Akte gehören. Die längste Frist hat Vorrang, wie bei Dokumenten.","Een kleine brug haalt het bericht op en schrijft het als kopie in Nextcloud.":"Eine kleine Brücke holt die Nachricht ab und schreibt sie als Kopie in Nextcloud.","Een leesbare weergave van het gesprek, als eigen informatieobject met een relatie naar elk bericht. Geen kopie.":"Eine lesbare Ansicht des Gesprächs, als eigenes Informationsobjekt mit einer Beziehung zu jeder Nachricht. Keine Kopie.","Een leverancier van de Cloud API, of rechtstreeks bij Meta.":"Ein Anbieter der Cloud API oder direkt bei Meta.","Een registerkoppeling voor chatberichten, naast die voor bestanden":"Eine Registeranbindung für Chatnachrichten, neben der für Dateien","Een ruimte of kanaal over werk is zakelijk. Alles wat erin staat, hoort bij het archief.":"Ein Raum oder Kanal über Arbeit ist dienstlich. Alles, was darin steht, gehört ins Archiv.","Een selectie van de medewerker, via de integratielaag":"Eine Auswahl der Mitarbeiterin, über die Integrationsschicht","Een één-op-één-gesprek scheid je zelf: zakelijk of persoonlijk, binnen tien dagen. Daarna geldt het als zakelijk.":"Ein Einzelgespräch ordnen Sie selbst zu: dienstlich oder persönlich, innerhalb von zehn Tagen. Danach gilt es als dienstlich.","Eerdere berichten vastgelegd vanaf de client":"Frühere Nachrichten vom Client aus erfasst","Eerdere berichten vastleggen vanaf jouw client":"Frühere Nachrichten von Ihrem Client aus erfassen","Eigen beheer":"Selbst betrieben","Eigen beheer, versleuteld":"Selbst betrieben, verschlüsselt","Eigen informatieobject, gekoppeld aan het bericht":"Eigenes Informationsobjekt, mit der Nachricht verknüpft","Elk chatkanaal komt op een andere manier in XENA. Het verschil zit in waar het origineel staat, wie het kan lezen en hoe volledig het archief is. Het archief zelf is voor alle kanalen hetzelfde: register, objectopslag en zoekindex.":"Jeder Chatkanal kommt auf andere Weise in XENA. Der Unterschied liegt darin, wo das Original liegt, wer es lesen kann und wie vollständig das Archiv ist. Das Archiv selbst ist für alle Kanäle gleich: Register, Objektspeicher und Suchindex.","Elk gesprek met een inwoner is volledig en vindbaar.":"Jedes Gespräch mit Einwohnern ist vollständig und auffindbar.","Elk zakelijk Teams-bericht staat als kopie in XENA.":"Jede dienstliche Teams-Nachricht liegt als Kopie in XENA.","Elke Matrix-server, zonder aanpassing":"Jeder Matrix-Server, ohne Anpassung","Elke aanvoer eindigt in een WebDAV-schrijfactie in Nextcloud":"Jede Zulieferung endet in einem WebDAV-Schreibvorgang in Nextcloud","Elke aanvoer eindigt op dezelfde plek: een WebDAV-schrijfactie in Nextcloud, die eerst het register bijwerkt. Geen aparte orkestratie, zoals bij ELSA.":"Jede Zulieferung endet an derselben Stelle: einem WebDAV-Schreibvorgang in Nextcloud, der zuerst das Register aktualisiert. Keine eigene Orchestrierung, wie bei ELSA.","Er is geen archiefkoppeling. De medewerker legt zakelijke berichten zelf vast via het deelmenu van de telefoon.":"Es gibt keine Archivanbindung. Die Mitarbeiterin erfasst dienstliche Nachrichten selbst über das Teilen-Menü des Telefons.","Er ontstaat een PDF/A-2 als weergave, gewaarmerkt namens de gemeente.":"Es entsteht ein PDF/A-2 als Ansicht, im Namen der Gemeinde gesiegelt.","Er staan nog geen berichten van dit gesprek in het archief.":"Von diesem Gespräch sind noch keine Nachrichten im Archiv.","Evenementenvergunning circuit 2027":"Veranstaltungsgenehmigung Rennstrecke 2027","Events API van de eigen werkruimte":"Events API des eigenen Workspace","Eén keer opgeslagen, vanuit elk kanaal te vinden.":"Einmal gespeichert, aus jedem Kanal auffindbar.","Eén object in de opslag, vier soorten aanvoer":"Ein Objekt im Speicher, vier Arten der Zulieferung","Eén-op-één":"Einzelgespräch","Fase 2 van de bestrating schuift twee weken op. Ik pas de terrasvergunningen aan; de ondernemers krijgen deze week bericht.":"Phase 2 der Pflasterarbeiten verschiebt sich um zwei Wochen. Ich passe die Terrassengenehmigungen an; die Gewerbetreibenden werden diese Woche informiert.","Federatie":"Föderation","Ga je vrijdag mee naar de borrel van Ans? Ze stopt eind van de maand.":"Kommst du Freitag mit zum Umtrunk von Ans? Sie hört Ende des Monats auf.","Gaat Team Vergunningen mee in de eerste golf?":"Ist Team Genehmigungen in der ersten Welle dabei?","Gebruiker in de ruimte":"Benutzer im Raum","Gedeeld kanaal met Bouwbed uis.":"The archive participant receives it as a member of the room and decrypts it in the archive service, with keys from the key vault.","De archiefdienst schrijft het bericht via WebDAV in Nextcloud, met het oorspronkelijke Matrix-event erbij.":"The archive service writes the message to Nextcloud via WebDAV, together with the original Matrix event.","De architectuurvisie waarop deze demo is gebaseerd; naast MIRA, TINA en ELSA":"The architecture vision this demo is based on; alongside MIRA, TINA and ELSA","De berichten staan alleen op de telefoons van de deelnemers. Er is geen koppeling; de medewerker legt zelf vast wat zakelijk is.":"The messages are only on the participants' phones. There is no integration; the employee records what is business themselves.","De berichtendienst stuurt een webhook naar het meldpunt; de brug schrijft het in Nextcloud.":"The messaging service sends a webhook to the endpoint; the bridge writes it to Nextcloud.","De chat draait bij een leverancier. Via een koppeling krijgt XENA een archiefwaardige kopie; het origineel blijft buiten de gemeente.":"The chat runs at a vendor. Through an integration, XENA receives an archive-grade copy; the original stays outside the municipality.","De chat draait in de Nextcloud-stack van de gemeente. Het bericht is aan de bron een informatieobject; een kopie is niet nodig.":"The chat runs in the municipality's Nextcloud stack. At the source, the message is an information object; no copy is needed.","De chat draait op een Matrix-server van de gemeente of van een andere overheid. De server kan de berichten niet lezen. Een zichtbare archiefdeelnemer, met sleutels van de gemeente, legt ze vast.":"The chat runs on a Matrix server of the municipality or of another government body. The server cannot read the messages. A visible archive participant, with the municipality's keys, records them.","De chat schrijft rechtstreeks in Nextcloud":"The chat writes directly to Nextcloud","De inwoner stuurt een bericht naar rmits Team joining the first wave?","Gebruiker in de ruimte":"User in the room","Gedeeld kanaal met Bouwbedrijf De Vaart":"Shared channel with Bouwbedrijf De Vaart","Geen; alleen het deelmenu van het toestel":"None; only the device's share menu","Gefedereerde chat, gearchiveerd aan de kant van de gemeente.":"Federated chat, archived on the municipality's side.","Gefedereerde ruimte · Tchap en Element · versleuteld":"Federated room · Tchap and Element · encrypted","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Data at the source: the message is stored once, and whoever needs it refers to it.","Geheimen":"Secrets","Gekoppeld aan een zaak":"Linked to a case","Gekoppeld aan zaak {0}.":"Linked to case {0}.","Gekoppeld object met eigen identificatie, geen ingesloten kopie.":"Linked object with its own identifier, not an embedded copy.","Gekozen":"Chosen","Gemaakt door":"Created by","Gemaakt op {0}: PDF/A-2, gewaarmerkt namens de gemeente. Het verslag verwijst naar {1} berichten in het archief.":"Created on {0}: PDF/A-2, sealed on behalf of the municipality. The record refers to {1} messages in the archive.","Gemarkeerd als persoonlijk":"Marked as personal","Gemeente Haarlem":"Municipality of Haarlem","Gemeente Heemstede":"Municipality of Heemstede","Gemeente Zandvoort":"Municipality of Zandvoort","Gemiddeld":"Medium","Gemiddeld: het origineel staat buiten de gemeente":"Medium: the original is outside the municipality","Genoteerd. U hoort van ons.":"Noted. You will hear from us.","Geschiedenis":"History","Gesprek":"Conversation","Gesprek als map, bericht als informatieobject, koppelingen met zaak en dossier":"Conversation as a folder, message as an information object, links to case and file","Gesprek opnemen in een dossier":"Add conversation to a file","Gesprekken":"Conversations","Gespreksverslag":"Conversation record","Gespreksverslag gemaakt":"Conversation record created","Gespreksverslag gemaakt en gewaarmerkt.":"Conversat  les habitants","Bestuurlijke informatie wethouder Mulder":"Information de l'exécutif, échevin Mulder","Bestuurlijke keuze":"Choix politique","Bestuursdossier":"Dossier de l'exécutif","Bevestigd. De geanonimiseerde versie is een eigen weergave; het origineel blijft ongewijzigd in het archief.":"Confirmé. La version anonymisée est une représentation distincte ; l'original reste inchangé dans les archives.","Bevestigd. De geanonimiseerde weergave is klaar voor de Woo.":"Confirmé. La représentation anonymisée est prête pour la Woo.","Bevestigen":"Confirmer","Bewaartermijnen":"Durées de conservation","Bewerken en verwijderen":"Modification et suppression","Bewerking":"Modification","Bewerkingen als nieuwe versie; verwijderde berichten zijn maar korte tijd op te halen":"Modifications sous forme de nouvelle version ; les messages supprimés ne sont récupérables que peu de temps","Bewerkingen en verwijderingen zijn eigen events; het archief bewaart ze allebei":"Les modifications et suppressions sont des événements à part ; les archives conservent les deux","Bewijskracht":"Valeur probante","Bezwaar leges dakkapel Kleverlaan 30":"Recours redevances lucarne Kleverlaan 30","Bezwaar omgevingsvergunning Kleverlaan 12":"Recours permis d'environnement Kleverlaan 12","Bij de gemeente, end-to-end versleuteld op de eigen Matrix-server":"À la commune, chiffré de bout en bout sur son propre serveur Matrix","Bij de gemeente, in de Nextcloud-stack van XENA":"À la commune, dans la pile Nextcloud de XENA","Bij de leverancier":"Chez le fournisseur","Bij de leverancier en op de telefoon van de inwoner":"Chez le fournisseur et sur le téléphone de l'habitant","Bij de leverancier, in Microsoft 365":"Chez le fournisseur, dans Microsoft 365","Bij een zakelijk gesprek uit het zicht, niet uit het archief. Het register legt vast wie het wanneer deed.":"Dans une conversation professionnelle, le message disparaît de la vue, pas des archives. Le registre consigne qui l'a fait et quand.","Bijlage":"Pièce iet meer: het archief verhuist nooit, alleen de bron van de berichten verandert.":"Projet. Ceci est un ordre, pas un calendrier. Le registre et le stockage objet sont en place dès l'étape 1 et ne changent plus ensuite : les archives ne déménagent jamais, seule la source des messages change.","Contact":"Contact","Contact met een inwoner is altijd zakelijk.":"Le contact avec un habitant est toujours professionnel.","Copyright":"Droits d'auteur","Daar loopt een bezwaar tegen. Ik stuur je het zaaknummer.":"Un recours est en cours à ce sujet. Je t'envoie le numéro de procédure.","Dan pas ik de terrasvergunningen aan.":"Alors j'adapte les autorisations de terrasse.","Dank u. Mijn man is bereikbaar op 06 98765432 als u ons wilt bellen.":"Merci. Mon mari est joignable au 06 98765432 si vous voulez nous appeler.","De MAIA-app met het deelmenu.":"L'application MAIA avec le menu de partage.","De MAIA-app vraagt om het gesprek, de deelnemers en een korte verklaring.":"L'application MAIA demande la conversation, les participants et une courte déclaration.","De Matrix-server bewaart en verspreidt het, zonder het te kunnen lezen.":"Le serveur Matrix le conserve et le diffuse, sans pouvoir le lire.","De archiefdeelnemer doet mee. Nieuwe berichten komen in het archief; eerdere berichten kan hij niet lezen.":"Le participant d'archivage a rejoint le salon. Les nouveaux messages arrivent dans les archives ; il ne peut pas lire les messages antérieurs.","De archiefdeelnemer ontvangt het als lid van de ruimte en ontsleutelt het in de archiefdienst, met sleutels uit de sleutelkluis.":"Le participant d'archivage le reçoit en tant que membre du salon et le déchiffre dans le service d'archivage, avec des clés du coffre-fort de clés.","De archiefdienst schrijft het bericht via WebDAV in Nextcloud, met het oorspronkelijke Matrix-event erbij.":"Le service d'archivage écrit le message dans Nextcloud via WebDAV, avec l'événement Matrix d'origine.","De architectuurvisie waarop deze demo is gebaseerd; naast MIRA, TINA en ELSA":"La vision d'architecture sur laquelle repose cette démo ; aux côtés de MIRA, TINA et ELSA","De berichten staan alleen op de telefoons van de deelnemers. Er is geen koppeling; de medewerker legt zelf vast wat zakelijk is.":"Les messages se trouvent uniquement sur les téléphones des participants. Il n'y a pas de connecteur ; l'agent consigne lui-même ce qui est professionnel.","De berichtendienst stuurt een webhook naar het meldpunt; de brug schrijft het in Nextcloud.":"Le service de messagerie envoie un webhook au point de réception ; la passerelle l'écrit dans Nextcloud.","De chat draait bij een leverancier. Via een koppeling krijgt XENA een archiefwaardige kopie; het origineel blijft buiten de gemeente.":"La messagerie tourne chez un fournisseur. Via un connecteur, XENA reçoit une copie à valeur archivistique ; l'original reste hors de la commune.","De chat draait in de Nextcloud-stack van de gemeente. Het bericht is aan de bron een informatieobject; een kopie is niet nodig.":"La messagerie tourne dans la pile Nextcloud de la commune. À la source, le message est un objet d'information ; une copie n'est pas nécessaire.","De chat draait op een Matrix-server van de gemeente of van een andere overheid. De server kan de berichten niet lezen. Een zichtbare archiefdeelnemer, met sleutels van de gemeente, legt ze vast.":"La messagerie tourne sur un serveur Matrix de la commune ou d'une autre administration. Le serveur ne peut pas lire les messages. Un participant d'archivage visible, avec des clés de la commune, les consigne.","De chat schrijft rechtstreeks in Nextcloud":"La messagerie écrit directement dans Nextcloud","De inwoner stuurt een bericht naar het nummer van de gemeente.":"L'habitant envoie un message au numéro de la commune.","De klantcontactomgeving toont het bericht; de medewerker antwoordt daar.":"L'environnement de relation usager affiche le message ; l'agent y répond.","De letter is de klasse: hoe het kanaal in het archief komt. Zie Kanalen.":"La lettre indique la classe : la façon dont le canal arrive dans les archives. Voir Canaux.","De leverancier stuurt een melding naar het meldpunt van de gemeente.":"Le fournisseur envoie une notification au point de réception de la commune.","De medewerker antwoordt in de klantcontactomgeving van de gemeente, niet in een app op de eigen telefoon. Het paneel staat daar.":"L'agent répond dans l'environnement de relation usager de la commune, pas dans une application sur son propre téléphone. Le volet s'y trouve.","De medewerker of de informatiebeheerder kiest Gespreksverslag maken.":"L'agent ou le gestionnaire de l'information choisit Créer un compte rendu de conversation.","De medewerker plaatst een bericht in Talk.":"L'agent publie un message dans Talk.","De medewerker plaatst een bericht, bijvoorbeeld in Teams.":"L'agent publie un message, par exemple dans Teams.","De medewerker selecteert berichten op de telefoon en kiest Delen, dan MAIA.":"L'agent sélectionne des messages sur le téléphone et choisit Partager, puis MAIA.","De medewerkers van de gemeente zitten met Element in deze ruimte, de Franse partners met Tchap. Het paneel staat alleen bij de gemeente.":"Les agents de la commune sont dans ce salon avec Element, les partenaires français avec Tchap. Le volet n'apparaît que côté commune.","De nieuwe planning voor de bestrating staat in de projectmap.":"Le nouveau calendrier du pavage se trouve dans le répertoire du projet.","De planning voor de migratie van de projectschijf staat onder Bestanden.":"Le calendrier de la migration du lecteur réseau du projet se trouve sous Fichiers.","De rest van het gesprek blijft op het toestel en komt niet in het archief.":"Le reste de la conversation reste sur l'appareil et n'entre pas dans les archives.","De selectie gaat via de integratielaag naar Nextcloud, als één informatieobject met de berichten erin.":"La sélection passe par la couche d'intégration vers Nextcloud, en un seul objet d'information contenant les messages.","De vraag of chatberichten in een soeverein platform als XENA kunnen, ook vanuit Teams":"La question de savoir si les messages instantanés peuvent être hébergés sur une plateforme souveraine comme XENA, y compris depuis Teams","De zaak komt uit het zaaksysteem, dat leidend blijft. MAIA legt de koppeling vast als kenmerk in het register.":"La procédure vient du système de gestion des procédures, qui reste la référence. MAIA enregistre le lien comme attribut dans le registre.","De zoekindex neemt het op, binnen het zoekbereik voor de Woo.":"L'index de recherche l'intègre, dans le périmètre de recherche Woo.","Deelmenu → MAIA-app":"Menu de partage → application MAIA","Deelnemer":"Participant","Deels niet in het archief":"Partiellement hors des archives","Delen naar MAIA: vastleggen":"Partager vers MAIA : consigner","Demo":"Démo","Demo: {0} dagen later":"Démo : {0} jours plus tard","Deze ruimte gaat over werk, maar heeft geen archiefdeelnemer. De Matrix-server kan de berichten niet lezen, dus ze komen niet in het archief.":"Ce salon porte sur le travail, mais n'a pas de participant d'archivage. Le serveur Matrix ne peut pas lire les messages, ils n'arrivent donc pas dans les archives.","Deze ruimte heeft geen archiefdeelnemer. Wat je hier typt, komt niet in het archief.":"Ce salon n'a pas de participant d'archivage. Ce que vous tapez ici n'arrive pas dans les archives.","Dezelfde laag als voor de kantoorpakketten en de mail. Op de werkplek staan geen sleutels.":"La même couche que pour les suites bureautiques et la messagerie électronique. Aucune clé sur le poste de travail.","Direct":"Direct","Dit bericht is verwijderd.":"Ce message a été supprimé.","Dit gesprek":"Cette conversation","Doorgeven":"Transmettre","Doorsturen door de client":"Transfert par le client","Duidelijke regels: werk in de chat van de gemeente. Wat toch via Signal gaat, leg je vast.":"Des règles claires : travaillez dans la messagerie de la commune. Ce qui passe malgré tout par Signal, consignez-le.","Een Matrix-client, zoals Element in MijnBureau of Tchap in LaSuite":"Un client Matrix, comme Element dans MijnBureau ou Tchap dans LaSuite","Een Matrix-gebruiker van de gemeente in elke zakelijke ruimte; sleutels in de sleutelkluis":"Un utilisateur Matrix de la commune dans chaque salon professionnel ; clés dans le coffre-fort de clés","Een archiefdeelnemer is zichtbaar. Dat is de bedoeling, maar het vraagt uitleg aan collega’s van andere organisaties.":"Un participant d'archivage est visible. C'est voulu, mais cela demande des explications aux collègues d'autres organisations.","Een bijlage is een eigen informatieobject. Het bericht verwijst ernaar, er is geen kopie.":"Une pièce jointe est un objet d'information distinct. Le message y renvoie, il n'y a pas de copie.","Een chat naast de bestanden, met het paneel van de Office Assistent.":"Une messagerie à côté des fichiers, avec le volet de l'Assistant Office.","Een deelnemer verstuurt een versleuteld bericht.":"Un participant envoie un message chiffré.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, organisaties, telefoonnummers, dossiers en zaaknummers bestaan niet. Productnamen staan er om herkenbaar te zijn; de demo is niet door de leveranciers gemaakt of goedgekeurd.":"Une démo, pas un produit. Toutes les données d'exemple sont fictives : les personnes, organisations, numéros de téléphone, dossiers et numéros de procédure n'existent pas. Les noms de produits sont cités pour être reconnaissables ; la démo n'a été ni réalisée ni approuvée par les éditeurs.","Een gedeeld Slack-kanaal met een ketenpartner archiveert de gemeente alleen in haar eigen werkruimte.":"Un canal Slack partagé avec un partenaire n'est archivé par la commune que dans son propre espace de travail.","Een gesprek kan bij meer dan één zaak of dossier horen. De langste termijn gaat voor, zoals bij documenten.":"Une conversation peut relever de plusieurs procédures ou dossiers. La durée la plus longue prévaut, comme pour les documents.","Een kleine brug haalt het bericht op en schrijft het als kopie in Nextcloud.":"Une petite passerelle récupère le message et l'écrit en copie dans Nextcloud.","Een leesbare weergave van het gesprek, als eigen informatieobject met een relatie naar elk bericht. Geen kopie.":"Une représentation lisible de la conversation, en tant qu'objet d'information distinct avec une relation vers chaque message. Pas de copie.","Een leverancier van de Cloud API, of rechtstreeks bij Meta.":"Un fournisseur de la Cloud API, ou directement Meta.","Een registerkoppeling voor chatberichten, naast die voor bestanden":"Un connecteur de registre pour les messages instantanés, à côté de celui pour les fichiers","Een ruimte of kanaal over werk is zakelijk. Alles wat erin staat, hoort bij het archief.":"Un salon ou un canal consacré au travail est professionnel. Tout ce qu'il contient relève des archives.","Een selectie van de medewerker, via de integratielaag":"Une sélection par l'agent, via la couche d'intégration","Een één-op-één-gesprek scheid je zelf: zakelijk of persoonlijk, binnen tien dagen. Daarna geldt het als zakelijk.":"Une conversation en tête-à-tête, c'est vous qui la triez : professionnelle ou personnelle, sous dix jours. Ensuite, elle est considérée comme professionnelle.","Eerdere berichten vastgelegd vanaf de client":"Messages antérieurs consignés depuis le client","Eerdere berichten vastleggen vanaf jouw client":"Consigner les messages antérieurs depuis votre client","Eigen beheer":"En régie","Eigen beheer, versleuteld":"En régie, chiffré","Eigen informatieobject, gekoppeld aan het bericht":"Objet d'information distinct, lié au message","Elk chatkanaal komt op een andere manier in XENA. Het verschil zit in waar het origineel staat, wie het kan lezen en hoe volledig het archief is. Het archief zelf is voor alle kanalen hetzelfde: register, objectopslag en zoekindex.":"Chaque canal de messagerie arrive dans XENA d'une façon différente. La différence tient à l'endroit où se trouve l'original, à qui peut le lire et à l'exhaustivité des archives. Les archives elles-mêmes sont identiques pour tous les canaux : registre, stockage objet et index de recherche.","Elk gesprek met een inwoner is volledig en vindbaar.":"Chaque conversation avec un habitant est complète et retrouvable.","Elk zakelijk Teams-bericht staat als kopie in XENA.":"Chaque message Teams professionnel figure en copie dans XENA.","Elke Matrix-server, zonder aanpassing":"Tout serveur Matrix, sans modification","Elke aanvoer eindigt in een WebDAV-schrijfactie in Nextcloud":"Chaque collecte se termine par une écriture WebDAV dans Nextcloud","Elke aanvoer eindigt op dezelfde plek: een WebDAV-schrijfactie in Nextcloud, die eerst het register bijwerkt. Geen aparte orkestratie, zoals bij ELSA.":"Chaque collecte aboutit au même endroit : une écriture WebDAV dans Nextcloud, qui met d'abord à jour le registre. Pas d'orchestration distincte, comme pour ELSA.","Er is geen archiefkoppeling. De medewerker legt zakelijke berichten zelf vast via het deelmenu van de telefoon.":"Il n'y a pas de connecteur d'archivage. L'agent consigne lui-même les messages professionnels via le menu de partage du téléphone.","Er ontstaat een PDF/A-2 als weergave, gewaarmerkt namens de gemeente.":"Un PDF/A-2 est produit comme représentation, scellé au nom de la commune.","Er staan nog geen berichten van dit gesprek in het archief.":"Aucun message de cette conversation ne figure encore dans les archives.","Evenementenvergunning circuit 2027":"Autorisation de manifestation circuit 2027","Events API van de eigen werkruimte":"Events API de son propre espace de travail","Eén keer opgeslagen, vanuit elk kanaal te vinden.":"Enregistré une seule fois, retrouvable depuis chaque canal.","Eén object in de opslag, vier soorten aanvoer":"Un objet dans le stockage, quatre types de collecte","Eén-op-één":"Tête-à-tête","Fase 2 van de bestrating schuift twee weken op. Ik pas de terrasvergunningen aan; de ondernemers krijgen deze week bericht.":"La phase 2 du pavage est décalée de deux semaines. J'adapte les autorisations de terrasse ; les commerçants seront prévenus cette semaine.","Federatie":"Fédération","Ga je vrijdag mee naar de borrel van Ans? Ze stopt eind van de maand.":"Tu viens au pot d'Ans vendredi ? Elle part à la fin du mois.","Gaat Team Vergunningen mee in de eerste golf?":"L'équipe Autorisations fait-elle partie de la première vague ?","Gebruiker in de ruimte":"Utilisateur dans le salon","Gedeeld kanaal met Bouwbedrijf De Vaart":"Canal partagé avec Bouwbedrijf De Vaart","Geen; alleen het deelmenu van het toestel":"Aucun ; seulement le menu de partage de l'appareil","Gefedereerde chat, gearchiveerd aan de kant van de gemeente.":"Messagerie fédérée, archivée côté commune.","Gefedereerde ruimte · Tchap en Element · versleuteld":"Salon fédéré · Tchap et Element · chiffré","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Données à la source : le message existe une fois, et qui en a besoin y renvoie.","Geheimen":"Secrets","Gekoppeld aan een zaak":"Lié à une procédure","Gekoppeld aan zaak {0}.":"Lié à la procédure {0}.","Gekoppeld object met eigen identificatie, geen ingesloten kopie.":"Objet lié avec son propre identifiant, pas une copie incorporée.","Gekozen":"Choisi","Gemaakt door":"Réalisé par","Gemaakt op {0}: PDF/A-2, gewaarmerkt namens de gemeente. Het verslag verwijst naar {1} berichten in het archief.":"Créé le {0} : PDF/A-2, scellé au nom de la commune. Le compte rendu renvoie à {1} messages dans les archives.","Gemarkeerd als persoonlijk":"Marqué comme personnel","Gemeente Haarlem":"Commune de Haarlem","Gemeente Heemstede":"Commune de Heemstede","Gemeente Zandvoort":"Commune de Zandvoort","Gemiddeld":"Moyenne","Gemiddeld: het origineel staat buiten de gemeente":"Moyenne : l'original se trouve hors de la commune","Genoteerd. U hoort van ons.":"C'est noté. Nous reviendrons vers vous.","Geschiedenis":"Historique","Gesprek":"Conversation","Gesprek als map, bericht als informatieobject, koppelingen met zaak en dossier":"Conversation comme répertoire, message comme objet d'information, liens avec la procédure et le dossier","Gesprek opnemen in een dossier":"Ajouter la conversation à un dossier","Gesprekken":"Conversations","Gespreksverslag":"Compte rendu de conversation","Gespreksverslag gemaakt":"Compte rendu de conversation créé","Gespreksverslag gemaakt en gewaarmerkt.":"Compte rendu de conversation créé et scellé.","Gespreksverslag maken":"Créer un compte rendu de conversation","Goedemiddag mevrouw De Graaf. Uw aanvraag is in behandeling. Er loopt nog een bezwaar over de leges; daarover krijgt u vóór 1 november bericht.":"Bonjour Madame De Graaf. Votre demande est en cours d'instruction. Un recours sur les redevances est encore en cours ; vous serez informée avant le 1er novembre.","Goedemiddag, drie weken geleden heb ik een vergunning aangevraagd voor een dakkapel aan de Kleverlaan 30. Hoe staat het ervoor?":"Bonjour, il y a trois semaines, j'ai demandé une autorisation pour une lucarne au Kleverlaan 30. Où en est ma demande ?","Goedemorgen! De aanvraag voor Kleverlaan 14 is binnen, met nieuwe tekeningen van de architect.":"Bonjour ! La demande pour le Kleverlaan 14 est arrivée, avec de nouveaux plans de l'architecte.","Goedkeuring en licenties voor de beschermde API van Microsoft.":"Approbation et licences pour l'API protégée de Microsoft.","Graag. Ik maak tien euro over.":"Avec plaisir. Je vire dix euros.","Granulariteit":"Granularité","Grensgevallen":"Cas limites","Groeipad":"Trajectoire","Groep · 3 deelnemers":"Groupe · 3 participants","Hardloopclubje Spaarndam":"Club de course Spaarndam","Heb je de opname van de sessie van gisteren?":"Tu as l'enregistrement de la session d'hier ?","Helder, dank je. Goed weekend straks!":"C'est clair, merci. Bon week-end !","Helemaal persoonlijk":"Entièrement personnelle","Help":"Aide","Herinrichting Houtplein":"Réaménagement du Houtplein","Herzien, kan tot {0}":"Révision possible jusqu'au {0}","Het Common Ground-team en het samenwerkingsverband OWC":"L'équipe Common Ground et le partenariat OWC","Het antwoord gaat via de API de deur uit en komt via dezelfde brug in het archief.":"La réponse sort via l'API et arrive dans les archives par la même passerelle.","Het archief verhuist niet; alleen de bron verandert.":"Les archives ne déménagent pas ; seule la source change.","Het archief verhuist nooit; alleen de bron verandert":"Les archives ne déménagent jamais ; seule la source change","Het bericht is het informatieobject. Een gesprek per dag of per onderwerp is een weergave, geen object.":"Le message est l'objet d'information. Une conversation par jour ou par sujet est une représentation, pas un objet.","Het dossier verwijst naar de berichten; er wordt niets gekopieerd.":"Le dossier renvoie aux messages ; rien n'est copié.","Het paneel staat als Slack-app in het kanaal. Een gedeeld kanaal met een ketenpartner wordt alleen aan de kant van de gemeente gearchiveerd.":"Le volet est une application Slack dans le canal. Un canal partagé avec un partenaire n'est archivé que côté commune.","Het paneel staat als Teams-app naast het gesprek. Bestanden in Teams staan in SharePoint of OneDrive en volgen het pad van de netwerkschijven.":"Le volet est une application Teams à côté de la conversation. Les fichiers dans Teams se trouvent dans SharePoint ou OneDrive et suivent le même chemin que les lecteurs réseau.","Het paneel staat als widget naast de ruimte in Element. In MijnBureau en openDesk is dat dezelfde client.":"Le volet est un widget à côté du salon dans Element. Dans MijnBureau et openDesk, c'est le même client.","Het paneel staat als zijbalk naast het gesprek in Nextcloud Talk, in de browser en in de bureaubladapp.":"Le volet est une barre latérale à côté de la conversation dans Nextcloud Talk, dans le navigateur et dans l'application de bureau.","Het register kent een duurzame identificatie toe en hangt het bericht aan het gesprek, dat als map in het register staat.":"Le registre attribue un identifiant pérenne et rattache le message à la conversation, qui figure comme répertoire dans le registre.","Het register legt de bron vast, met de identificatie bij de leverancier. Een bewerking wordt een nieuwe versie.":"Le registre consigne la source, avec l'identifiant chez le fournisseur. Une modification devient une nouvelle version.","Het register legt vast wie de selectie heeft gemaakt en verklaard.":"Le registre consigne qui a fait la sélection et l'a déclarée.","Het verslag is een eigen informatieobject met een relatie naar elk bericht, geen kopie.":"Le compte rendu est un objet d'information distinct avec une relation vers chaque message, pas une copie.","Het zaaknummer staat in het gesprek.":"Le numéro de procédure figure dans la conversation.","Hetzelfde voor alle kanalen. Zo werkt zoeken voor de Woo over Talk, Matrix, Teams en Signal heen.":"Identique pour tous les canaux. Ainsi, la recherche Woo couvre à la fois Talk, Matrix, Teams et Signal.","Hoe XENA het krijgt":"Comment XENA le reçoit","Hoe gaan jullie om met dakopbouwen in beschermd stadsgezicht?":"Comment gérez-vous les surélévations en site patrimonial protégé ?","Hoog":"Élevée","Hoog: het archief ontvangt het bericht als deelnemer, met het oorspronkelijke event":"Élevée : les archives reçoivent le message en tant que participant, avec l'événement d'origine","Hoog: het origineel is het archiefexemplaar":"Élevée : l'original est l'exemplaire d'archives","Ik ben erbij. 10 kilometer?":"J'en suis. 10 kilomètres ?","Ik laat de ondernemers vandaag weten dat de zuidkant dicht is.":"Je préviens les commerçants aujourd'hui que le côté sud est fermé.","Ik pak hem op. Welstand vergadert donderdag, dan kan hij mee.":"Je m'en occupe. La commission de la qualité architecturale se réunit jeudi, le dossier peut y passer.","In 2025 werd een aangepaste versie van Signal gehackt die Amerikaanse overheden gebruikten om berichten te archiveren. De app stuurde de berichten onversleuteld naar een archiefserver van de leverancier.":"En 2025, une version modifiée de Signal, utilisée par des administrations américaines pour archiver les messages, a été piratée. L'application envoyait les messages non chiffrés à un serveur d'archivage du fournisseur.","In SharePoint of OneDrive":"Dans SharePoint ou OneDrive","In SharePoint. Het register verwijst naar het bestand als eigen informatieobject.":"Dans SharePoint. Le registre renvoie au fichier comme objet d'information distinct.","In een gefedereerde Matrix-ruimte archiveert elke organisatie aan haar eigen kant. Wat de gemeente bewaart, hangt niet af van de andere servers.":"Dans un salon Matrix fédéré, chaque organisation archive de son côté. Ce que la commune conserve ne dépend pas des autres serveurs.","In een gefedereerde ruimte archiveert de gemeente aan haar eigen kant. Afspraken met de partners zijn nodig over wat zij van de archiefdeelnemer zien.":"Dans un salon fédéré, la commune archive de son côté. Des accords avec les partenaires sont nécessaires sur ce qu'ils voient du participant d'archivage.","In een gefedereerde ruimte doet de archiefdeelnemer mee vanaf de server van de gemeente. Ook de berichten van de Franse partners worden aan de kant van de gemeente gearchiveerd.":"Dans un salon fédéré, le participant d'archivage participe depuis le serveur de la commune. Les messages des partenaires français sont eux aussi archivés côté commune.","In het archief":"Dans les archives","In stap 1 staat het origineel nog bij Microsoft. Dat is een tussenstap om te leren, geen eindbeeld.":"À l'étape 1, l'original est encore chez Microsoft. C'est une étape intermédiaire pour apprendre, pas une cible.","Informatieobject van het type chatbericht. Eigen identificatie, het oorspronkelijke formaat (Matrix-event, Graph- of Slack-JSON) en een gelijkgetrokken vorm in ActivityStreams 2.0.":"Objet d'information de type message instantané. Identifiant propre, format d'origine (événement Matrix, JSON Graph ou Slack) et forme normalisée en ActivityStreams 2.0.","Integratielaag, aan de serverkant":"Couche d'intégration, côté serveur","Interactieve demo, versie {0}":"Démo interactive, version {0}","Interreg Côte Durable":"Interreg Côte Durable","Inwoner":"Habitant","Is dat de planning na het overleg met de ondernemers?":"C'est le calendrier issu de la concertation avec les commerçants ?","Is de verkeersmaatregel daarvoor aangevraagd?":"La mesure de circulation a-t-elle été demandée pour cela ?","J. de Graaf":"J. de Graaf","Ja":"Oui","Ja, begin november. Ik plan een sessie met de sleutelgebruikers.":"Oui, début novembre. Je prévois une session avec les utilisateurs référents.","Ja, half november. Ik plan een sessie met de sleutelgebruikers.":"Oui, mi-novembre. Je prévois une session avec les utilisateurs référents.","Ja, het besluit zit in de bijlage.":"Oui, la décision est dans la pièce jointe.","Ja, via meldingen":"Oui, par notifications","Ja. Fase 2 schuift twee weken op.":"Oui. La phase 2 est décalée de deux semaines.","Je verklaart daarmee dat dit de zakelijke berichten uit het gesprek zijn. Dat komt in het register.":"Vous déclarez ainsi qu'il s'agit des messages professionnels de la conversation. Cette déclaration est inscrite au registre.","Jij":"Vous","Jij ook!":"Toi aussi !","Kan nu":"Possible dès maintenant","Kan nu, naast de huidige werkplek":"Possible dès maintenant, à côté du poste de travail actuel","Kanaal":"Canal","Kanalen":"Canaux","Kies een dossier":"Choisir un dossier","Kies een verbinding links om de stappen te zien.":"Choisissez une connexion à gauche pour voir les étapes.","Kies een zaak":"Choisir une procédure","Klantcontactomgeving op de Cloud API, brug, anonimiseren":"Environnement de relation usager sur la Cloud API, passerelle, anonymisation","Klasse":"Classe","Koppelen":"Lier","Koppelen aan een zaak":"Lier à une procédure","Koppeling":"Lien","Kun je kijken naar de leges voo
